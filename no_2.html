<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="고1 정보가 쉬워지는 파이썬 1부 2장 집필 초안: input(), 입력값 저장, 문자열, 아스키코드, type(), int(), str()">
<title>고1 정보가 쉬워지는 파이썬 | 1부 · 2장 키보드로 값을 입력받기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1D23; --body:#33383F; --paper:#FFFFFF; --wash:#F7F8F9;
  --blue:#2E7CC4; --blue-d:#1F5E99; --yellow:#C9911A;
  --code:#15181E; --muted:#7A818B; --line:#DFE2E6;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
  --mono:'JetBrains Mono','D2Coding',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);
  line-height:1.75;font-size:15.5px;-webkit-font-smoothing:antialiased}

.wrap{display:flex;min-height:100vh;align-items:flex-start}
.sidebar{width:272px;flex:0 0 272px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--wash);border-right:1px solid var(--line);padding:0 0 40px}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand .tgt{display:block;font-size:11px;color:var(--blue);margin-bottom:5px}
.brand .bk{display:block;font-weight:700;font-size:16px;line-height:1.4;color:var(--ink)}
.brand .sub2{display:block;margin-top:7px;font-size:11.5px;color:var(--muted);line-height:1.55}
.brand .by{display:block;margin-top:9px;font-size:11.5px;color:var(--muted)}
.navlabel{padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.navlabel .part{display:block;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:3px}
.navlabel .chapter{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:9px;padding:8px 20px;text-decoration:none;color:var(--body);font-size:14px}
.toc a:hover{background:#EDEFF2}
.toc a .n{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 30px}
.toc a.on{background:var(--blue-d);color:#FFF;font-weight:500}
.toc a.on .n{color:#BBD8F0}

.main{flex:1;min-width:0;display:flex;justify-content:center;padding:0 44px 90px}
.page{width:100%;max-width:720px;padding-top:38px}

.banner{margin:0 0 26px}
.banner .bmark{display:none}
.partkicker{display:block;margin-bottom:10px;color:var(--blue-d);font-size:12px;font-weight:700;
  letter-spacing:-.01em}
h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1.4}
h1 .num{border-bottom:3px solid var(--blue);padding-bottom:5px;margin-right:7px}
h2{font-size:18px;font-weight:700;letter-spacing:-.025em;margin:44px 0 14px;color:var(--ink);
  padding-bottom:8px;border-bottom:1px solid var(--line)}
h2 .qn{color:var(--blue);margin-right:6px}
h3{font-size:15.5px;font-weight:600;margin:26px 0 7px;color:var(--ink)}
.lede{font-size:16px;color:var(--ink);margin:0 0 8px}
p{margin:0 0 13px}
strong{font-weight:600;color:var(--ink)}
code{font-family:var(--mono);font-size:.88em;background:#EFF1F3;color:#2A5F8F;padding:1px 5px;border-radius:3px}

.ask{border:1px solid var(--line);border-radius:4px;background:var(--wash);
  padding:13px 17px;margin:0 0 26px;font-size:15.5px;color:var(--ink)}
.ask .who{display:block;font-size:11.5px;color:var(--blue);margin-bottom:5px;font-weight:600}

.codewrap{margin:14px 0}
.codehead{font-size:12px;color:var(--muted);margin-bottom:5px}
pre{margin:0;background:var(--code);color:#E4E7EC;border-radius:4px;padding:14px 17px;
  overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.7}
pre .c{color:#A3ADBD} pre .s{color:#E5C07B} pre .k{color:#C678DD}
pre .f{color:#61AFEF} pre .b{color:#98C379}
pre .bl{display:inline-block;min-width:2.2em;height:1.15em;background:#B9BFC9;
  border-radius:2px;vertical-align:-.16em;margin:0 2px}
pre .bl[data-a]{cursor:pointer;text-align:center;color:#15181E;font-weight:500;
  line-height:1.15em;padding:0 5px;transition:background .12s}
pre .bl[data-a]:hover{background:#D5DAE1}
pre .bl.ok{background:#7BC47F;color:#0E2E12}
pre .bl.no{background:#E38B7E;color:#3A0F08}
.blmenu{
  position:fixed;z-index:99;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:5px;
  max-height:270px;overflow-y:auto;min-width:132px;
}
.blmenu button{
  display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-size:13px;color:var(--ink);padding:6px 10px;border-radius:3px;
}
.blmenu button:hover{background:var(--wash)}
.blhint{margin:-6px 0 16px;font-size:13px;color:var(--muted)}
.out{border:1px solid #D5D9E0;border-radius:4px;
  background:#F5F6F8;padding:11px 17px 12px;margin:8px 0 14px;font-family:var(--mono);
  font-size:13.5px;white-space:pre-wrap;line-height:1.7;color:var(--ink)}
.out::before{content:'실행 결과';display:block;font-family:var(--sans);font-size:11px;
  font-weight:600;color:#5F6875;margin-bottom:5px}
.pair{margin:0 0 18px}
.pair pre{border-radius:4px 4px 0 0}
.pair .out{margin:0;border-radius:0 0 4px 4px;border-top:none}

figure{margin:18px 0 20px}
figure img{width:100%;display:block;border:1px solid var(--line);border-radius:4px}
figcaption{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.6}
figcaption b{color:var(--ink);font-weight:600}

.predict{border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:18px 0}
.predict .ttl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:9px}
.predict pre{margin-bottom:11px}
.picks{display:flex;gap:7px;flex-wrap:wrap}
.pick{flex:1 1 118px;border:1px solid var(--line);border-radius:3px;background:var(--wash);
  padding:9px 11px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;line-height:1.6}
.pick .no{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}

.note{border:1px solid var(--line);border-radius:4px;background:var(--wash);
  padding:13px 17px;margin:18px 0;font-size:15px}
.note .ttl{font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink)}
.note p:last-child,.note ul{margin-bottom:0}
.key{border:1px solid #E3D5AE;background:#FCFAF3;border-radius:4px;padding:14px 18px;margin:30px 0 8px}
.key .ttl{font-size:12px;font-weight:600;color:#96700F;margin-bottom:7px}
.key ul{margin:0;padding-left:17px} .key li{margin-bottom:3px}
.warn{border:1px solid #E8CCC5;background:#FCF7F5;border-radius:4px;padding:13px 17px;margin:18px 0;font-size:15px}
.warn .ttl{font-weight:600;font-size:13.5px;color:#A8412A;margin-bottom:5px}

ul,ol{margin:0 0 14px;padding-left:20px} li{margin-bottom:4px}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px}
th,td{border:1px solid var(--line);padding:9px 13px;text-align:left}
th{background:var(--wash);font-weight:600;font-size:13.5px;color:var(--ink)}

.sumtbl{font-size:14px}
.sumtbl th:first-child{width:180px}
.sumtbl td{vertical-align:top;padding:12px 14px}
.sumtbl td:first-child{font-weight:600;color:var(--ink)}
.sumtbl .no{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:700;margin-right:7px}
.sumtbl ul{margin:0;padding-left:18px;line-height:1.65}
.sumtbl li{margin-bottom:2px}
.bank{border:1px solid var(--line);border-radius:4px;padding:13px 17px;margin:16px 0}
.bank .ttl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:13px;background:var(--wash);border:1px solid var(--line);
  border-radius:3px;padding:4px 10px;color:var(--ink)}
details{border:1px solid var(--line);border-radius:4px;padding:11px 17px;margin:16px 0}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--blue-d)}
details[open] summary{margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line)}
details p:last-child{margin-bottom:0}

.step{display:flex;gap:13px;margin-bottom:2px}
.step .num{flex:0 0 22px;height:22px;border-radius:3px;background:var(--blue-d);color:#FFF;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;margin-top:6px}
.step .body{flex:1;min-width:0}
.step .body h3{margin-top:1px}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:56px;
  border-top:1px solid var(--line);padding-top:20px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--line);border-radius:4px;
  padding:11px 15px;color:var(--body)}
.pager a:hover{border-color:var(--blue)}
.pager .dir{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.pager .t{font-weight:600;font-size:13.5px;color:var(--ink)}
.pager .next{text-align:right} .pager .ph{flex:1}
.footnote{margin-top:30px;font-size:11.5px;color:var(--muted)}

.mobbar{display:none}
@media (max-width:980px){
  .wrap{flex-direction:column}
  .sidebar{position:static;width:100%;flex:none;height:auto;border-right:none;
    border-bottom:1px solid var(--line);padding-bottom:10px}
  .sidebar.collapsed .navlabel,.sidebar.collapsed .toc{display:none}
  .main{padding:0 18px 60px} .page{padding-top:26px}
  h1{font-size:21px} h2{font-size:17px;margin-top:34px}
  .mobbar{display:block;margin:10px 18px 0;padding:7px 12px;border:1px solid var(--line);
    border-radius:4px;background:var(--paper);font-size:13px;cursor:pointer;color:var(--ink);font-family:var(--sans)}
  .picks{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar collapsed" id="sb">
    <div class="brand">
      <span class="tgt">예비 고1을 위한</span>
      <span class="bk">고1 정보가 쉬워지는 파이썬</span>
      <span class="sub2">스크래치를 몰라도 그림으로 원리를 보고,<br>파이썬 코드로 옮길 수 있습니다.</span>
      <span class="by">이현아 · 한다인</span>
    </div>
    <button class="mobbar" id="mob">목차</button>
    <div class="navlabel">
      <span class="part">1부 값을 입력하고 결과를 출력하기</span>
      <span class="chapter">2장 키보드로 값을 입력받기</span>
    </div>
    <ul class="toc" id="toc"></ul>
  </aside>
  <main class="main"><div class="page" id="pg"></div></main>
</div>
<script>
const P=[{"n":"2장","t":"들어가며","h":"\n<div class=\"banner\"><h1><span class=\"num\">2장</span>키보드로 값을 입력받기</h1></div>\n\n<p class=\"lede\">1장에서는 이름과 나이를 코드에 직접 저장했다. 이제 프로그램이 사용자에게 값을 묻고, 입력한 내용으로 같은 결과를 만들도록 바꿔보자.</p>\n\n<div class=\"out\">이름은? 한다인\n나이는? 17\n저의 이름은 한다인이고, 나이는 17세입니다.\n3년 후에는 20세가 됩니다.</div>\n\n<div class=\"codewrap\">\n  <div class=\"codehead\">완성할 코드</div>\n  <pre><span class=\"b\">name</span> = <span class=\"bl\"></span>(<span class=\"s\">'이름은? '</span>)\n<span class=\"b\">age</span> = <span class=\"bl\"></span>(<span class=\"bl\"></span>(<span class=\"s\">'나이는? '</span>))\n<span class=\"f\">print</span>(<span class=\"k\">f</span><span class=\"s\">'저의 이름은 {name}이고, 나이는 {age}세입니다.'</span>)\n<span class=\"f\">print</span>(<span class=\"k\">f</span><span class=\"s\">'3년 후에는 {age + 3}세가 됩니다.'</span>)</pre>\n</div>\n\n<h2>무엇이 달라져야 할까</h2>\n<ul>\n  <li>프로그램이 이름과 나이를 물어봐야 한다</li>\n  <li>키보드로 입력한 값을 변수에 저장해야 한다</li>\n  <li>입력한 나이로 계산하려면 숫자로 바꿔야 한다</li>\n</ul>\n\n<div class=\"ask\"><span class=\"who\">먼저 생각하기</span>1장에서 만든 코드 중 어떤 줄을 바꾸면 사용자가 이름과 나이를 직접 입력할 수 있을까?</div>\n"},{"n":"2-1","t":"input()으로 질문하고 기다리기","h":"\n<div class=\"banner\"><h1><span class=\"num\">2-1</span><code>input()</code>으로 질문하고 기다리기</h1></div>\n\n<p class=\"lede\">스크래치의 ‘묻고 기다리기’ 블록은 질문을 보여준 뒤 사용자가 답을 입력할 때까지 기다린다. 파이썬에서는 <code>input()</code>이 같은 일을 한다.</p>\n\n<figure>\n  <img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/2wBDAAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQH/2wBDAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQH/wAARCAM2A9MDASEAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQ ><td><code>input()</code></td></tr>\n  <tr><td>블록 안의 질문</td><td><code>input()</code> 괄호 안의 문자열</td></tr>\n  <tr><td>확인 버튼 누르기</td><td>Enter 누르기</td></tr>\n</table>\n\n<div class=\"note\">\n  <div class=\"ttl\">질문 뒤에 띄어쓰기를 넣는 이유</div>\n  <p><code>input('이름은? ')</code>처럼 물음표 뒤에 한 칸을 넣으면 질문과 사용자의 입력이 붙지 않아 읽기 쉽다.</p>\n</div>\n\n<div class=\"key\">\n  <div class=\"ttl\">이것만 기억하자</div>\n  <ul>\n    <li><code>input()</code>은 질문을 보여주고 입력을 기다린다</li>\n    <li>입력을 마치려면 Enter를 누른다</li>\n  </ul>\n</div>\n"},{"n":"2-2","t":"입력한 값을 변수에 저장하기","h":"\n<div class=\"banner\"><h1><span class=\"num\">2-2</span>입력한 값을 변수에 저장하기</h1></div>\n\n<p class=\"lede\"><code>input()</code>으로 받은 값을 나중에 다시 사용하려면 변수에 저장해야 한다.</p>\n\n<figure>\n  <img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/2wBDAAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQH/2wBDAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQH/wAARCAMxA9cDASEAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD+3iiv0A+XCigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAr5q+Knxov9A1Wbw34VECXlkQmp6rcQrcCK4ZA/2SygkzAXhVl+0TzpKvmloEhUxNI3tZDlkc0x6o1W1QpU5Vq3K7SlGLjGMFLo5znFNrXkUnFppNdOFoqvV5ZfDFOUtbNpWSXzbV7dLnjH/C7Pid/wBDN/5RvD//AMqqP+F2fE7/AKGb/wAo3h//AOVVfoH+rGR/9AP/AJc c/+WVHJHt+L/zDnl3/AAX+Qf8ACo/h5/0L/wD5Vtc/+WVH/Co/h5/0L/8A5Vtc/wDllRyR7fi/8w55d/wX+Qf8Kj+Hn/Qv/wDlW1z/AOWVH/Co/h5/0L//AJVtc/8AllRyR7fi/wDMOeXf8F/kH/Co/h5/0L//AJVtc/8AllWjp/w38D6ZKs9p4dsjKjB0a7e51HYwOVZV1Ce6VWU4KsACrAFSCAQcse35hzS7/kdsAAAAAAAAABgADgAAcAAcADpS1RIUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQB//Z\" alt=\"대답을 이름 변수에 저장하고 인사하는 스크래치 코드\">\n  <figcaption><b>그림 2-4.</b> 입력한 대답을 이름 변수에 저장하면 여러 블록에서 다시 사용할 수 있다.</figcaption>\n</figure>\n\n<h2><span class=\"qn\">1)</span>파이썬에서는 어디에 저장할까</h2>\n\n<div class=\"pair\">\n  <pre><span class=\"b\">name</span> = <span class=\"f\">input</span>(<span class=\"s\">'이름은? '</span>)\n<span class=\"f\">print</span>(<span class=\"k\">f</span><span class=\"s\">'안녕 {name} 반가워~'</span>)</pre>\n  <div class=\"out\">이름은? 한다인\n안녕 한다인 반가워~</div>\n</div>\n\n<p><code>input()</code>은 사용자가 입력한 값을 돌려준다. 함수가 돌려주는 값을 <b>반환값</b>이라고 한다. <code>=</code>는 그 반환값을 왼쪽의 <code>name</code>에 저장한다.</p>\n\n<h2><span class=\"qn\">2)</span>실행 순서는 어떻게 될까</h2>\n\n<div class=\"step\"><div class=\"num\">1</div><div class=\"body\"><h3>질문을 보여준다</h3><p><code>input('이름은? ')</code>이 실행된다.</p></div></div>\n<div class=\"step\"><div class=\"num\">2</div><div class=\"body\"><h3>사용자가 입력한다</h3><p>키보드로 이름을 입력하고 Enter를 누른다.</p></div></div>\n<div class=\"step\"><div class=\"num\">3</div><div class=\"body\"><h3>변수에 저장한다</h3><p><code>input()</code>이 돌려준 값을 <code>name</code>에 저장한다.</p></div></div>\n<div class=\"step\"><div class=\"num\">4</div><div class=\"body\"><h3>저장한 값을 사용한다</h3><p>f-string의 <code>{name}</code> 자리에 입력한 이름을 넣어 출력한다.</p></div></div>\n\n<div class=\"note\">\n  <div class=\"ttl\">1장에서 배운 대입이 그대로 사용된다</div>\n  <p><code>name = '한다인'</code>은 코드에 적은 값을 저장하고, <code>name = input('이름은? ')</code>은 사용자가 입력한 값을 저장한다. 값이 오는 곳만 달라졌을 뿐 변수의 역할은 같다.</p>\n</div>\n\n<div class=\"key\">\n  <div class=\"ttl\">이것만 기억하자</div>\n  <ul>\n    <li><code>input()</code>의 반환값은 사용자가 입력한 값이다</li>\n    <li><code>변수 = input('질문')</code>으로 입력한 값을 저장한다</li>\n  </ul>\n</div>\n"},{"n":"2-3","t":"숫자를 입력했는데 왜 문자인가","h":"\n<div class=\"banner\"><h1><span class=\"num\">2-3</span>숫자를 입력했는데 왜 문자인가</h1></div>\n\n<p class=\"lede\">키보드로 숫자를 입력해도 <code>input()</code>의 결과는 문자열이다. 실행 결과를 예상한 뒤 그 이유를 알아보자.</p>\n\n<div class=\"predict\">\n  <div class=\"ttl\">결과 예상해 보기</div>\n  <pre><span class=\"b\">age</span> = <span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>)  <span class=\"c\"># 17 입력</span>\n<span class=\"f\">print</span>(<span class=\"b\">age</span> + <span class=\"s\">3</span>)</pre>\n  <div class=\"picks\">\n    <div class=\"pick\"><span class=\"no\">1)</span>20</div>\n    <div class=\"pick\"><span class=\"no\">2)</span>173</div>\n    <div class=\"pick\"><span class=\"no\">3)</span>오류 발생</div>\n  </div>\n</div>\n\n<h2>실행 결과</h2>\n\n<div class=\"pair\">\n  <pre><span class=\"b\">age</span> = <span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>)\n<span class=\"f\">print</span>(<span class=\"b\">age</span> + <span class=\"s\">3</span>)</pre>\n  <div class=\"out\">나이는? 17\nTypeError: can only concatenate str (not \"int\") to str</div>\n</div>\n\n<p>정답은 <b>3번, 오류 발생</b>이다. 메시지에는 <code>str</code>과 <code>int</code>를 더할 수 없다고 적혀 있다. <code>str</code>은 문자열이고 <code>int</code>는 정수다. 파이썬은 <code>age</code>에 저장된 값을 정수가 아니라 문자열로 보고 있다.</p>\n\n<h2><code>type()</code>으로 자료형 알아보기</h2>\n\n<div class=\"pair\">\n  <pre><span class=\"b\">age</span> = <span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>)\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"b\">age</span>))</pre>\n  <div class=\"out\">나이는? 17\n&lt;class 'str'&gt;</div>\n</div>\n\n<p><code>type()</code>은 값의 자료형을 알려주는 함수다.</p>\n\n<div class=\"note\">\n  <div class=\"ttl\">왜 항상 문자열일까</div>\n  <p>파이썬의 <code>input()</code>은 사용자가 입력한 전체 내용을 하나의 문자열로 돌려주도록 정해져 있다. 따라서 숫자 키 1과 7을 눌러도 정수 <code>17</code>이 아니라 문자 <code>'1'</code>과 <code>'7'</code>이 이어진 문자열 <code>'17'</code>이 된다.</p>\n</div>\n\n<h2>컴퓨터는 문자를 번호로 저장한다</h2>\n\n<p>컴퓨터의 모든 데이터는 내부적으로 0과 1로 저장된다. 글자도 그대로 저장할 수 없으므로 글자마다 번호를 정해 사용한다. 이러한 문자 코드 중 하나가 <b>아스키코드</b>다.</p>\n\n<p>아스키코드는 영문자, 숫자, 기본 기호와 제어 코드에 0부터 127까지 번호를 정한다. 7비트로 128개의 값을 표현한다.</p>\n\n<table>\n  <tr><th>누른 키</th><th>2진수</th><th>10진수</th></tr>\n  <tr><td><code>A</code></td><td><code>01000001</code></td><td>65</td></tr>\n  <tr><td><code>1</code></td><td><code>00110001</code></td><td>49</td></tr>\n</table>\n\n<p>아스키코드 값을 외울 필요는 없다. 다만 숫자 키 1을 눌러 입력한 문자 <code>'1'</code>에도 문자 코드가 있다는 점은 알아두자. 아스키코드에서 문자 <code>'1'</code>의 코드값은 숫자 1이 아니라 49다.</p>\n\n<div class=\"pair\">\n  <pre><span class=\"f\">print</span>(<span class=\"f\">ord</span>(<span class=\"s\">'A'</span>))\n<span class=\"f\">print</span>(<span class=\"f\">bin</span>(<span class=\"f\">ord</span>(<span class=\"s\">'A'</span>)))</pre>\n  <div class=\"out\">65\n0b1000001</div>\n</div>\n\n<p><code>ord()</code>는 문자의 코드값을 알려주고, <code>bin()</code>은 숫자를 이진수로 나타낸다. 두 함수를 외우기보다 컴퓨터가 문자도 번호로 구분한다는 원리를 이해하면 된다.</p>\n\n<div class=\"note\">\n  <div class=\"ttl\">한글은 유니코드로 표현한다</div>\n  <p>아스키코드는 영문자와 숫자, 기본 기호를 표현한다. 한글을 비롯한 세계 여러 문자는 유니코드를 사용하며, 파이썬 문자열도 유니코드를 기반으로 처리된다.</p>\n</div>\n\n<h2>문자열의 <code>+</code>는 이어 붙이기</h2>\n\n<div class=\"pair\">\n  <pre><span class=\"f\">print</span>(<span class=\"s\">'5'</span> + <span class=\"s\">'7'</span>)</pre>\n  <div class=\"out\">57</div>\n</div>\n\n<p>문자열 사이의 <code>+</code>는 계산하지 않고 두 문자열을 이어 붙인다. 입력한 두 수가 5와 7이어도 자료형을 바꾸지 않으면 12가 아니라 57이 나오는 이유다.</p>\n\n<div class=\"key\">\n  <div class=\"ttl\">이것만 기억하자</div>\n  <ul>\n    <li><code>input()</code>의 결과는 항상 문자열이다</li>\n    <li><code>type()</code>은 값의 자료형을 알려준다</li>\n    <li>문자열의 <code>+</code>는 값을 이어 붙인다</li>\n  </ul>\n</div>\n"},{"n":"2-4","t":"type(), int(), str() 정리하기","h":"\n<div class=\"banner\"><h1><span class=\"num\">2-4</span><code>type()</code>, <code>int()</code>, <code>str()</code> 정리하기</h1></div>\n\n<p class=\"lede\"><code>type()</code>은 자료형을 알려준다. <code>int()</code>는 값을 정수로, <code>str()</code>은 문자열로 변환한다.</p>\n\n<table>\n  <tr><th>함수</th><th>역할</th><th>예</th></tr>\n  <tr><td><code>type()</code></td><td>자료형을 알려준다</td><td><code>type('5')</code> → <code>&lt;class 'str'&gt;</code></td></tr>\n  <tr><td><code>int()</code></td><td>정수 모양의 문자열을 정수로 변환한다</td><td><code>int('5')</code> → <code>5</code></td></tr>\n  <tr><td><code>str()</code></td><td>숫자 등의 값을 문자열로 변환한다</td><td><code>str(5)</code> → <code>'5'</code></td></tr>\n</table>\n\n<div class=\"note\">\n  <div class=\"ttl\">변환한 값 저장하기</div>\n  <p><code>int(a)</code>와 <code>str(a)</code>는 변환한 값을 돌려준다. 변환한 값을 계속 사용하려면 <code>a = int(a)</code> 또는 <code>a = str(a)</code>처럼 변수에 저장한다.</p>\n</div>\n\n<h2><span class=\"qn\">1)</span>입력과 변환을 한 줄에 쓸 수 있을까</h2>\n\n<div class=\"pair\">\n  <pre><span class=\"b\">age</span> = <span class=\"f\">int</span>(<span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>))\n<span class=\"f\">print</span>(<span class=\"k\">f</span><span class=\"s\">'3년 후에는 {age + 3}세가 됩니다.'</span>)</pre>\n  <div class=\"out\">나이는? 17\n3년 후에는 20세가 됩니다.</div>\n</div>\n\n<p>함수 안에 함수가 있을 때는 가장 안쪽부터 실행한다.</p>\n\n<div class=\"step\"><div class=\"num\">1</div><div class=\"body\"><h3><code>input()</code> 실행</h3><p>사용자가 입력한 문자열 <code>'17'</code>을 돌려준다.</p></div></div>\n<div class=\"step\"><div class=\"num\">2</div><div class=\"body\"><h3><code>int()</code> 실행</h3><p>문자열 <code>'17'</code>을 정수 <code>17</code>로 바꾼다.</p></div></div>\n<div class=\"step\"><div class=\"num\">3</div><div class=\"body\"><h3>변수에 저장</h3><p>정수 <code>17</code>을 <code>age</code>에 저장한다.</p></div></div>\n\n<p>입력값을 문자열로 저장한 뒤 계산할 때만 <code>int(age)</code>로 바꿔도 된다.</p>\n\n<div class=\"pair\">\n  <pre><span class=\"b\">age</span> = <span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>)\n<span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"b\">age</span>) + <span class=\"s\">3</span>)</pre>\n  <div class=\"out\">나이는? 17\n20</div>\n</div>\n\n<p><code>int(age)</code>가 문자열 <code>'17'</code>을 정수 <code>17</code>로 변환한 뒤 3을 더한다. 여러 번 계산할 값이라면 <code>age = int(input('나이는? '))</code>처럼 입력받을 때 정수로 변환해 저장하는 편이 간단하다.</p>\n\n<h2><span class=\"qn\">2)</span>숫자를 문자열로 바꾸면 무엇이 달라질까</h2>\n\n<div class=\"pair\">\n  <pre><span class=\"b\">a</span> = <span class=\"s\">5</span>\n<span class=\"f\">print</span>(<span class=\"f\">str</span>(<span class=\"b\">a</span>) * <span class=\"b\">a</span>)</pre>\n  <div class=\"out\">55555</div>\n</div>\n\n<p><code>a</code>는 반복 횟수로 사용하는 정수 5이고, <code>str(a)</code>는 반복할 문자열 <code>'5'</code>다. 문자열에 정수를 곱하면 해당 문자열이 정수만큼 반복된다.</p>\n\n<div class=\"note\">\n  <div class=\"ttl\"><code>int()</code>는 정수 모양의 문자열만 바꿀 수 있다</div>\n  <p><code>int('17')</code>은 정수 <code>17</code>로 바꿀 수 있다. 그러나 <code>int('열일곱')</code>과 <code>int('17.5')</code>는 정수 모양의 문자열이 아니므로 오류가 발생한다.</p>\n</div>\n\n<div class=\"key\">\n  <div class=\"ttl\">이것만 기억하자</div>\n  <ul>\n    <li><code>type()</code>은 값의 자료형을 알려준다</li>\n    <li><code>int()</code>는 정수, <code>str()</code>은 문자열로 바꾼다</li>\n    <li><code>int(input('질문'))</code>은 입력한 문자열을 정수로 바꿔 저장한다</li>\n    <li>문자열에 정수를 곱하면 문자열이 반복된다</li>\n  </ul>\n</div>\n"},{"n":"마무리","t":"입력받는 자기소개 프로그램 완성하기","h":"\n<div class=\"banner\"><h1><span class=\"num\">2장 마무리</span>입력받는 자기소개 프로그램 완성하기</h1></div>\n\n<p class=\"lede\">1장에서 만든 자기소개 프로그램의 값을 <code>input()</code>으로 바꿔보자. 출력하는 두 줄은 그대로 사용할 수 있다.</p>\n\n<h2>1장에서 바뀐 부분</h2>\n\n<table>\n  <tr><th>1장: 코드에 직접 저장</th><th>2장: 키보드로 입력받아 저장</th></tr>\n  <tr><td><code>name = '한다인'</code></td><td><code>name = input('이름은? ')</code></td></tr>\n  <tr><td><code>age = 17</code></td><td><code>age = int(input('나이는? '))</code></td></tr>\n</table>\n\n<p>값이 들어오는 방법은 달라졌지만 <code>name</code>과 <code>age</code>라는 변수 이름은 같다. 그래서 아래의 출력 코드는 바꿀 필요가 없다.</p>\n\n<h2>완성</h2>\n\n<div class=\"pair\">\n  <pre><span class=\"b\">name</span> = <span class=\"f\">input</span>(<span class=\"s\">'이름은? '</span>)\n<span class=\"b\">age</span> = <span class=\"f\">int</span>(<span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>))\n\n<span class=\"f\">print</span>(<span class=\"k\">f</span><span class=\"s\">'저의 이름은 {name}이고, 나이는 {age}세입니다.'</span>)\n<span class=\"f\">print</span>(<span class=\"k\">f</span><span class=\"s\">'3년 후에는 {age + 3}세가 됩니다.'</span>)</pre>\n  <div class=\"out\">이름은? 한다인\n나이는? 17\n저의 이름은 한다인이고, 나이는 17세입니다.\n3년 후에는 20세가 됩니다.</div>\n</div>\n\n<div class=\"note\">\n  <div class=\"ttl\">변수를 사용하는 이유가 더 분명해졌다</div>\n  <p>입력한 이름과 나이가 달라져도 아래의 출력 코드는 바뀌지 않는다. 값에 이름을 붙여두면 값이 어디에서 오든 같은 코드를 다시 사용할 수 있다.</p>\n</div>\n\n<div class=\"key\">\n  <div class=\"ttl\">문제 해결 순서</div>\n  <p>질문하기 → 입력받기 → 필요한 자료형으로 바꾸기 → 변수에 저장하기 → 계산하고 출력하기</p>\n</div>\n\n<div class=\"ask\"><span class=\"who\">다음 장</span>다음 장에서는 정수, 실수, 문자열의 차이와 자료형에 따라 사용할 수 있는 연산을 더 자세히 살펴본다.</div>\n"},{"n":"점검","t":"중간점검과 요점 정리","h":"\n<div class=\"banner\"><h1><span class=\"num\">2장 점검</span>빈칸으로 흐름 확인하기</h1></div>\n\n<p class=\"lede\">보기에서 알맞은 값을 골라 입력받는 자기소개 프로그램을 완성한다. 회색 빈칸을 누르면 보기가 열린다.</p>\n\n<div class=\"bank\">\n  <div class=\"ttl\">보기</div>\n  <div class=\"chips\">\n    <span class=\"chip\">① input</span><span class=\"chip\">② int</span><span class=\"chip\">③ name</span><span class=\"chip\">④ age</span>\n    <span class=\"chip\">⑤ answer</span><span class=\"chip\">⑥ '17'</span><span class=\"chip\">⑦ 17</span><span class=\"chip\">⑧ f</span>\n  </div>\n</div>\n\n<div class=\"codewrap\"><pre><span class=\"b\">name</span> = <span class=\"bl\" data-a=\"1\"></span>(<span class=\"s\">'이름은? '</span>)\n<span class=\"b\">age</span> = <span class=\"bl\" data-a=\"2\"></span>(<span class=\"bl\" data-a=\"1\"></span>(<span class=\"s\">'나이는? '</span>))\n<span class=\"f\">print</span>(<span class=\"bl\" data-a=\"8\"></span><span class=\"s\">'저의 이름은 {name}이고, 나이는 {age}세입니다.'</span>)</pre></div>\n\n<details>\n  <summary>정답</summary>\n  <p><b>① ② ① ⑧</b></p>\n  <ul style=\"margin-bottom:0\">\n    <li>이름은 문자열이므로 <code>input()</code>의 결과를 그대로 저장한다</li>\n    <li>나이는 계산에 사용하므로 <code>int()</code>로 정수로 바꾼다</li>\n    <li>문장 안에 변수 값을 넣으려면 따옴표 앞에 <code>f</code>를 붙인다</li>\n  </ul>\n</details>\n\n<h2>요점 정리</h2>\n<p>이 장에서 배운 네 가지 핵심을 확인한다.</p>\n\n<table class=\"sumtbl\">\n  <tr><th>구분</th><th>핵심 내용</th></tr>\n  <tr><td><span class=\"no\">2-1</span><code>input()</code></td><td>질문을 보여주고 사용자가 Enter를 누를 때까지 입력을 기다린다</td></tr>\n  <tr><td><span class=\"no\">2-2</span>입력값 저장</td><td><code>변수 = input('질문')</code>으로 입력한 값을 저장하고 다시 사용한다</td></tr>\n  <tr><td><span class=\"no\">2-3</span>입력값의 자료형</td><td><code>type()</code>은 <code>input()</code>의 결과가 문자열임을 알려주며, 문자는 내부적으로 코드값으로 표현된다</td></tr>\n  <tr><td><span class=\"no\">2-4</span>자료형 변환</td><td><code>int()</code>는 정수, <code>str()</code>은 문자열로 바꾼다</td></tr>\n</table>\n"},{"n":"연습","t":"연습문제","h":"\n<div class=\"banner\"><h1><span class=\"num\">2장</span>연습문제</h1></div>\n<p class=\"lede\"><code>type()</code>, <code>int()</code>, <code>str()</code>의 역할과 문자열 연산을 확인한다.</p>\n\n<h2>1. 입력한 두 수 더하기</h2>\n<p>먼저 다음 코드를 실행하고 결과를 확인한다.</p>\n<div class=\"pair\">\n  <pre><span class=\"b\">a</span> = <span class=\"f\">input</span>(<span class=\"s\">'첫 번째 수는? '</span>)\n<span class=\"b\">b</span> = <span class=\"f\">input</span>(<span class=\"s\">'두 번째 수는? '</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'두 수의 합은'</span>, <span class=\"b\">a</span> + <span class=\"b\">b</span>)</pre>\n  <div class=\"out\">첫 번째 수는? 5\n두 번째 수는? 7\n두 수의 합은 57</div>\n</div>\n\n<p>두 수의 합이 12가 되도록 빈칸을 채운다.</p>\n<div class=\"codewrap\"><pre><span class=\"b\">a</span> = <span class=\"bl\"></span>(<span class=\"f\">input</span>(<span class=\"s\">'첫 번째 수는? '</span>))\n<span class=\"b\">b</span> = <span class=\"bl\"></span>(<span class=\"f\">input</span>(<span class=\"s\">'두 번째 수는? '</span>))\n<span class=\"f\">print</span>(<span class=\"s\">'두 수의 합은'</span>, <span class=\"b\">a</span> + <span class=\"b\">b</span>)</pre></div>\n<details>\n  <summary>정답</summary>\n  <p><b>방법 1: 입력받을 때 변환하기</b></p>\n  <div class=\"codewrap\"><pre><span class=\"b\">a</span> = <span class=\"f\">int</span>(<span class=\"f\">input</span>(<span class=\"s\">'첫 번째 수는? '</span>))\n<span class=\"b\">b</span> = <span class=\"f\">int</span>(<span class=\"f\">input</span>(<span class=\"s\">'두 번째 수는? '</span>))\n<span class=\"f\">print</span>(<span class=\"s\">'두 수의 합은'</span>, <span class=\"b\">a</span> + <span class=\"b\">b</span>)</pre></div>\n  <p><b>방법 2: 계산할 때 변환하기</b></p>\n  <div class=\"codewrap\"><pre><span class=\"b\">a</span> = <span class=\"f\">input</span>(<span class=\"s\">'첫 번째 수는? '</span>)\n<span class=\"b\">b</span> = <span class=\"f\">input</span>(<span class=\"s\">'두 번째 수는? '</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'두 수의 합은'</span>, <span class=\"f\">int</span>(<span class=\"b\">a</span>) + <span class=\"f\">int</span>(<span class=\"b\">b</span>))</pre></div>\n  <p style=\"color:var(--muted);font-size:14px\">두 방법 모두 가능하다. 여러 번 계산할 값은 입력받을 때 정수로 바꿔 저장하는 편이 간단하다.</p>\n</details>\n\n<h2>2. 두 문자열 이어 붙이기</h2>\n<div class=\"codewrap\"><pre><span class=\"b\">a</span> = <span class=\"s\">'py'</span>\n<span class=\"b\">b</span> = <span class=\"s\">'thon'</span>\n<span class=\"f\">print</span>(<span class=\"s\">'두 문자를 더하면'</span>, <span class=\"bl\"></span>, <span class=\"s\">'입니다.'</span>)</pre></div>\n<div class=\"out\">두 문자를 더하면 python 입니다.</div>\n<details>\n  <summary>정답</summary>\n  <p><code>a + b</code></p>\n  <p style=\"color:var(--muted);font-size:14px\">문자열 사이의 <code>+</code>는 두 문자열을 이어 붙인다.</p>\n</details>\n\n<h2>3. 숫자를 문자열로 바꾸어 반복하기</h2>\n<div class=\"codewrap\"><pre><span class=\"b\">a</span> = <span class=\"f\">int</span>(<span class=\"f\">input</span>(<span class=\"s\">'숫자를 입력하시오: '</span>))\n<span class=\"f\">print</span>(<span class=\"k\">f</span><span class=\"s\">'숫자 {a}를 문자로 바꾸어 {a}번 출력하면 {</span><span class=\"bl\"></span><span class=\"s\"> * a}입니다.'</span>)</pre></div>\n<div class=\"out\">숫자를 입력하시오: 5\n숫자 5를 문자로 바꾸어 5번 출력하면 55555입니다.</div>\n<details>\n  <summary>정답</summary>\n  <div class=\"codewrap\"><pre><span class=\"b\">a</span> = <span class=\"f\">int</span>(<span class=\"f\">input</span>(<span class=\"s\">'숫자를 입력하시오: '</span>))\n<span class=\"f\">print</span>(<span class=\"k\">f</span><span class=\"s\">'숫자 {a}를 문자로 바꾸어 {a}번 출력하면 {str(a) * a}입니다.'</span>)</pre></div>\n  <p style=\"color:var(--muted);font-size:14px\"><code>str(a)</code>는 문자열 <code>'5'</code>이고, 문자열에 정수 5를 곱하면 같은 문자열이 다섯 번 반복된다.</p>\n</details>\n"},{"n":"Q&A","t":"수업 중에 자주 나오는 질문","h":"\n<div class=\"banner\"><h1><span class=\"num\">2장 Q&amp;A</span>수업 중에 자주 나오는 질문</h1></div>\n\n<div class=\"ask\"><span class=\"who\">질문 1</span>숫자를 입력했는데 왜 문자열이라고 하나요?</div>\n<p>화면에서 17로 보여도 <code>input()</code>이 돌려주는 값은 문자열 <code>'17'</code>이다. 입력한 값을 계산에 사용하려면 <code>int()</code>로 정수로 바꾼다.</p>\n\n<div class=\"ask\"><span class=\"who\">질문 2</span>두 줄의 코드를 한 줄로 쓸 수 있나요?</div>\n<div class=\"codewrap\"><pre><span class=\"b\">a</span> = <span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>)\n<span class=\"b\">a</span> = <span class=\"f\">int</span>(<span class=\"b\">a</span>)</pre></div>\n<p>첫 번째 줄에서 입력한 문자열을 <code>a</code>에 저장하고, 두 번째 줄에서 <code>a</code>를 정수로 변환한다. <code>int(a)</code>의 <code>a</code> 자리에 <code>input()</code>의 결과를 바로 넣으면 두 줄을 한 줄로 쓸 수 있다.</p>\n<div class=\"codewrap\"><pre><span class=\"b\">a</span> = <span class=\"f\">int</span>(<span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>))</pre></div>\n<p>안쪽의 <code>input()</code>이 먼저 실행되고, 입력한 문자열을 바깥쪽의 <code>int()</code>가 정수로 변환한다. 두 코드는 같은 결과를 만든다.</p>\n\n<div class=\"ask\"><span class=\"who\">질문 3</span><code>type(a)</code>와 <code>int(a)</code>는 무엇이 다른가요?</div>\n<div class=\"pair\">\n  <pre><span class=\"b\">a</span> = <span class=\"s\">'17'</span>\n\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"b\">a</span>))\n<span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"b\">a</span>))</pre>\n  <div class=\"out\">&lt;class 'str'&gt;\n17</div>\n</div>\n<p>두 함수 모두 결과값을 돌려준다. <code>type(a)</code>는 <code>a</code>의 자료형을 알려주고, <code>int(a)</code>는 문자열 <code>'17'</code>을 정수 <code>17</code>로 변환한 결과를 돌려준다.</p>\n\n<div class=\"ask\"><span class=\"who\">질문 4</span>나이를 묻는데 사용자가 문자를 입력하면 어떻게 되나요?</div>\n<div class=\"pair\">\n  <pre><span class=\"b\">age</span> = <span class=\"f\">int</span>(<span class=\"f\">input</span>(<span class=\"s\">'나이는? '</span>))</pre>\n  <div class=\"out\">나이는? 열일곱\nValueError: invalid literal for int() with base 10: '열일곱'</div>\n</div>\n<p><code>int()</code>가 정수 모양이 아닌 문자열을 숫자로 바꿀 수 없어 발생한 오류다. 지금은 정수 모양을 입력해야 한다는 점만 기억한다. 잘못된 입력을 다시 받는 방법은 조건문과 반복문을 배운 뒤 다룬다.</p>\n\n<div class=\"key\">\n  <div class=\"ttl\">1부 · 2장 정리</div>\n  <ul>\n    <li><code>input()</code>은 입력을 기다리고 입력한 문자열을 돌려준다</li>\n    <li>입력값을 다시 사용하려면 변수에 저장한다</li>\n    <li><code>type()</code>은 값의 자료형을 알려준다</li>\n    <li><code>int()</code>는 정수, <code>str()</code>은 문자열로 바꾼다</li>\n    <li>함수가 겹치면 가장 안쪽부터 실행한다</li>\n  </ul>\n</div>\n"}];

const toc=document.getElementById('toc'),pg=document.getElementById('pg');
P.forEach((p,i)=>{
  const li=document.createElement('li');
  li.innerHTML=`<a href="#p${i}"><span class="n">${p.n}</span><span>${p.t}</span></a>`;
  toc.appendChild(li);
});
function render(){
  let i=parseInt((location.hash||'#p0').slice(2));
  if(isNaN(i)||i<0||i>=P.length)i=0;
  let nav='<div class="pager">';
  nav += i>0?`<a href="#p${i-1}"><span class="dir">PREV</span><span class="t">${P[i-1].n} ${P[i-1].t}</span></a>`:'<span class="ph"></span>';
  nav += i<P.length-1?`<a class="next" href="#p${i+1}"><span class="dir">NEXT</span><span class="t">${P[i+1].n} ${P[i+1].t}</span></a>`:'<span class="ph"></span>';
  nav+='</div>';
  const context='<div class="partkicker">1부 · 값을 입력하고 결과를 출력하기</div>';
  pg.innerHTML=context+P[i].h+nav+'<p class="footnote">고1 정보가 쉬워지는 파이썬 · 1부 · 2장 · 집필 초안</p>';
  document.querySelectorAll('.toc a').forEach((a,k)=>a.classList.toggle('on',k===i));
  closeMenu();bindBlanks();
  window.scrollTo({top:0,behavior:'instant'});
}
const BANK=['input','int','name','age','answer',"'17'",'17','f'];
const CIRC=['①','②','③','④','⑤','⑥','⑦','⑧'];
let menu=null;
function closeMenu(){if(menu){menu.remove();menu=null;}}
addEventListener('click',e=>{if(menu&&!menu.contains(e.target))closeMenu();});
addEventListener('scroll',closeMenu,true);
function bindBlanks(){
  document.querySelectorAll('pre .bl[data-a]').forEach(bl=>{
    bl.onclick=ev=>{
      ev.stopPropagation();closeMenu();
      const r=bl.getBoundingClientRect();
      menu=document.createElement('div');menu.className='blmenu';
      BANK.forEach((v,i)=>{
        const b=document.createElement('button');
        b.textContent=CIRC[i]+' '+v;
        b.onclick=()=>{
          bl.textContent=v;
          bl.classList.remove('ok','no');
          bl.classList.add(String(i+1)===bl.dataset.a?'ok':'no');
          closeMenu();
        };
        menu.appendChild(b);
      });
      document.body.appendChild(menu);
      const mh=menu.offsetHeight, mw=menu.offsetWidth;
      let top=r.bottom+6, left=r.left;
      if(top+mh>innerHeight-8) top=Math.max(8,r.top-mh-6);
      if(left+mw>innerWidth-8) left=innerWidth-mw-8;
      menu.style.top=top+'px';menu.style.left=left+'px';
    };
  });
}
addEventListener('hashchange',render);render();
const sb=document.getElementById('sb'),mob=document.getElementById('mob');
mob.onclick=()=>{sb.classList.toggle('collapsed');};
if(innerWidth>980)sb.classList.remove('collapsed');
addEventListener('resize',()=>{if(innerWidth>980)sb.classList.remove('collapsed')});
