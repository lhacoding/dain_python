<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="고1 정보가 쉬워지는 파이썬 3장: 숫자와 문자열 다루기">
<title>고1 정보가 쉬워지는 파이썬 | 3장 숫자와 문자열 다루기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>

:root{
  --ink:#1A1D23; --body:#33383F; --paper:#FFFFFF; --wash:#F7F8F9;
  --blue:#2E7CC4; --blue-d:#1F5E99; --yellow:#C9911A;
  --code:#15181E; --muted:#7A818B; --line:#DFE2E6;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
  --heading:'Pretendard','IBM Plex Sans KR',system-ui,sans-serif;
  --mono:'JetBrains Mono','D2Coding',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);
  line-height:1.75;font-size:15.5px;-webkit-font-smoothing:antialiased}

.wrap{display:flex;min-height:100vh;align-items:flex-start}
.sidebar{width:272px;flex:0 0 272px;position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--wash);border-right:1px solid var(--line);padding:0 0 40px}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand .tgt{display:block;font-size:11px;color:var(--blue);margin-bottom:5px}
.brand .bk{display:block;font-weight:700;font-size:16px;line-height:1.4;color:var(--ink)}
.brand .sub2{display:block;margin-top:7px;font-size:11.5px;color:var(--muted);line-height:1.55}
.brand .by{display:block;margin-top:9px;font-size:11.5px;color:var(--muted)}
.navlabel{padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.navlabel .part{display:block;font-size:11px;font-weight:700;color:var(--blue);margin-bottom:3px}
.navlabel .chapter{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:9px;padding:8px 20px;text-decoration:none;color:var(--body);font-size:14px}
.toc a:hover{background:#EDEFF2}
.toc a .n{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 30px}
.toc a.on{background:var(--blue-d);color:#FFF;font-weight:500}
.toc a.on .n{color:#BBD8F0}

.main{flex:1;min-width:0;display:flex;justify-content:center;padding:0 44px 90px}
.page{width:100%;max-width:850px;padding-top:38px}

.banner{margin:0 0 26px}
.banner .bmark{display:none}
.partkicker{display:block;margin-bottom:10px;color:var(--blue-d);font-size:12px;font-weight:700;
  letter-spacing:-.01em}
h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1.4}
h1 .num{border-bottom:3px solid var(--blue);padding-bottom:5px;margin-right:7px}
h2{font-family:var(--heading);font-size:18px;font-weight:600;letter-spacing:-.025em;margin:44px 0 14px;color:var(--ink);
  padding-bottom:8px;border-bottom:1px solid var(--line)}
h2 .qn{color:var(--blue);margin-right:6px}
h3{font-family:var(--heading);font-size:15.5px;font-weight:600;margin:26px 0 7px;color:var(--ink)}
.lede{font-size:16px;color:var(--ink);margin:0 0 8px}
p{margin:0 0 13px}
strong{font-weight:600;color:var(--ink)}
code{font-family:var(--mono);font-size:.88em;background:none;color:#2A5F8F;padding:0;border-radius:0}

.ask{border:1px solid var(--line);border-radius:4px;background:var(--wash);
  padding:13px 17px;margin:0 0 26px;font-size:15.5px;color:var(--ink)}
.ask .who{display:block;font-size:11.5px;color:var(--blue);margin-bottom:5px;font-weight:600}

.codewrap{margin:14px 0}
.codehead{font-size:12px;color:var(--muted);margin-bottom:5px}
pre{margin:0;background:var(--code);color:#E4E7EC;border-radius:4px;padding:14px 17px;
  overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.7}
pre .c{color:#A3ADBD} pre .s{color:#E5C07B} pre .k{color:#C678DD}
pre .f{color:#61AFEF} pre .b{color:#98C379}
pre .bl{display:inline-block;min-width:2.2em;height:1.15em;background:#B9BFC9;
  border-radius:2px;vertical-align:-.16em;margin:0 2px}
pre .bl[data-a]{cursor:pointer;text-align:center;color:#15181E;font-weight:500;
  line-height:1.15em;padding:0 5px;transition:background .12s}
pre .bl[data-a]:hover{background:#D5DAE1}
pre .bl.ok{background:#7BC47F;color:#0E2E12}
pre .bl.no{background:#E38B7E;color:#3A0F08}
.blmenu{
  position:fixed;z-index:99;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:5px;
  max-height:270px;overflow-y:auto;min-width:132px;
}
.blmenu button{
  display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
  font-family:var(--mono);font-size:13px;color:var(--ink);padding:6px 10px;border-radius:3px;
}
.blmenu button:hover{background:var(--wash)}
.blhint{margin:-6px 0 16px;font-size:13px;color:var(--muted)}
.out{border:1px solid #D5D9E0;border-radius:4px;
  background:#F5F6F8;padding:11px 17px 12px;margin:8px 0 14px;font-family:var(--mono);
  font-size:13.5px;white-space:pre-wrap;line-height:1.7;color:var(--ink)}
.out::before{content:'실행 결과';display:block;font-family:var(--sans);font-size:11px;
  font-weight:600;color:#5F6875;margin-bottom:5px}
.pair{margin:0 0 18px}
.pair pre{border-radius:4px 4px 0 0}
.pair .out{margin:0;border-radius:0 0 4px 4px;border-top:none}

figure{margin:18px 0 20px}
figure img{width:100%;display:block;border:1px solid var(--line);border-radius:4px}
figcaption{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.6}
figcaption b{color:var(--ink);font-weight:600}

.predict{border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:18px 0}
.predict .ttl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:9px}
.predict pre{margin-bottom:11px}
.picks{display:flex;gap:7px;flex-wrap:wrap}
.pick{flex:1 1 118px;border:1px solid var(--line);border-radius:3px;background:var(--wash);
  padding:9px 11px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;line-height:1.6}
.pick .no{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}

.note{border:1px solid var(--line);border-radius:4px;background:var(--wash);
  padding:13px 17px;margin:18px 0;font-size:15px}
.note .ttl{font-weight:600;font-size:14px;margin-bottom:6px;color:var(--ink)}
.note p:last-child,.note ul{margin-bottom:0}
.key{border:1px solid #E3D5AE;background:#FCFAF3;border-radius:4px;padding:14px 18px;margin:30px 0 8px}
.key .ttl{font-size:12px;font-weight:600;color:#96700F;margin-bottom:7px}
.key ul{margin:0;padding-left:17px} .key li{margin-bottom:3px}
.warn{border:1px solid #E8CCC5;background:#FCF7F5;border-radius:4px;padding:13px 17px;margin:18px 0;font-size:15px}
.warn .ttl{font-weight:600;font-size:13.5px;color:#A8412A;margin-bottom:5px}

ul,ol{margin:0 0 14px;padding-left:20px} li{margin-bottom:4px}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px}
th,td{border:1px solid var(--line);padding:9px 13px;text-align:left}
th{background:var(--wash);font-weight:600;font-size:13.5px;color:var(--ink)}

.sumtbl{font-size:14px}
.sumtbl th:first-child{width:180px}
.sumtbl td{vertical-align:top;padding:12px 14px}
.sumtbl td:first-child{font-weight:600;color:var(--ink)}
.sumtbl .no{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--blue);font-weight:700;margin-right:7px}
.sumtbl ul{margin:0;padding-left:18px;line-height:1.65}
.sumtbl li{margin-bottom:2px}
.bank{border:1px solid var(--line);border-radius:4px;padding:13px 17px;margin:16px 0}
.bank .ttl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:13px;background:var(--wash);border:1px solid var(--line);
  border-radius:3px;padding:4px 10px;color:var(--ink)}
details{border:1px solid var(--line);border-radius:4px;padding:11px 17px;margin:16px 0}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--blue-d)}
details[open] summary{margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line)}
details p:last-child{margin-bottom:0}

.step{display:flex;gap:13px;margin-bottom:2px}
.step .num{flex:0 0 22px;height:22px;border-radius:3px;background:var(--blue-d);color:#FFF;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;margin-top:6px}
.step .body{flex:1;min-width:0}
.step .body h3{margin-top:1px}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:56px;
  border-top:1px solid var(--line);padding-top:20px}
.pager a{flex:1;text-decoration:none;border:1px solid var(--line);border-radius:4px;
  padding:11px 15px;color:var(--body)}
.pager a:hover{border-color:var(--blue)}
.pager .dir{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.pager .t{font-weight:600;font-size:13.5px;color:var(--ink)}
.pager .next{text-align:right} .pager .ph{flex:1}
.footnote{margin-top:30px;font-size:11.5px;color:var(--muted)}

.mobbar{display:none}

/* 1장 보완: 읽기 폭과 시각 비교 영역 */
.scratch-overview{max-width:390px;margin:12px auto 18px}
.scratch-overview.scratch-build{max-width:410px}
.scratch-overview img{display:block;width:100%;height:auto;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:transparent}
.compare-wide{width:100%;margin:14px 0 18px}
.compare-grid{display:grid;grid-template-columns:minmax(0,40fr) minmax(0,60fr);gap:14px;align-items:start;border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.compare-card{border:0;background:var(--paper);padding:3px 5px;min-width:0}
.compare-card:first-child{padding-left:0}
.compare-card .cttl{font-size:12px;font-weight:700;color:var(--blue-d);margin-bottom:7px}
.compare-card .scratch-crop{min-height:110px;display:flex;align-items:center;justify-content:flex-start;background:#FFF;overflow:visible;padding:0}
.compare-card .scratch-crop img{display:block;width:auto;height:auto;max-width:190px;max-height:120px;object-fit:contain;border:none;border-radius:0;background:transparent;margin:0}
.compare-card pre{font-size:13px}
.compare-card .pair{margin:0}
.compare-card .out{margin-bottom:0}
.compare-note{margin-top:8px;font-size:14px;color:var(--body);line-height:1.6}
.compare-note b{color:var(--ink)}
.input-sim{display:flex;align-items:center;gap:8px;min-height:54px;padding:10px 16px;background:#FFF;border:1px solid #D5D9E0;border-top:none;border-radius:0 0 4px 4px;font-family:var(--mono);font-size:13.5px;color:var(--ink)}
.input-sim .prompt{white-space:nowrap}
.input-sim .field{display:flex;align-items:center;min-width:220px;max-width:100%;height:32px;padding:3px 9px;border:1.5px solid #777;background:#FFF;color:var(--ink);font-family:var(--mono);font-size:13.5px;line-height:1}
.compare-card .input-sim .field{min-width:0;flex:1}
.rule-table{font-size:14.5px;table-layout:auto}
.rule-table th,.rule-table td{padding:9px 10px;white-space:nowrap}
.rule-table th:first-child,.rule-table td:first-child{width:145px}
.rule-table th:last-child,.rule-table td:last-child{width:170px}
.goalout{margin:7px 0 10px}
.goalout::before{content:'출력 결과'}
.checkitem{border-top:1px solid var(--line);padding-top:18px;margin-top:22px}
.checkitem:first-of-type{border-top:none;padding-top:0}
.checkitem h3{margin:0 0 8px;font-size:15.5px}
.checkitem .qdesc{font-size:14px;color:var(--muted);margin-bottom:8px}
.checkitem .bank{margin:9px 0 10px;padding:9px 12px}
.checkitem .bank .ttl{margin-bottom:6px}
.checkitem details{margin-top:10px}
.checkitem .answhy{font-size:14px;color:var(--body)}
.bank .chips{row-gap:6px}
.bank .chip{white-space:nowrap}


.scratch-observe{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:10px;align-items:center;margin:12px 0 8px}
.scratch-shot{text-align:center;min-width:0}
.scratch-shot img{display:block;width:100%;max-width:388px;height:auto;object-fit:contain;margin:0 auto;border:1px solid var(--line);border-radius:4px;background:transparent}
.scratch-shot .cap{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.5;text-align:center}
.scratch-arrow{text-align:center;color:var(--muted);font-size:18px}
.discover-q{margin:8px 0 10px;font-size:14.5px;color:var(--ink);font-weight:600}
.ruleline{border-left:3px solid var(--blue);padding:6px 0 6px 11px;margin:8px 0 24px;font-size:14.5px;line-height:1.65}
.ruleline strong{color:var(--ink)}
.ruleline code{white-space:nowrap}

.help-table{table-layout:fixed}
.help-table td:first-child,.help-table th:first-child{width:115px;white-space:nowrap}
.help-table td:last-child{white-space:normal}
.result-rule td:nth-child(2),.result-rule th:nth-child(2){white-space:normal}
.var-name-table{font-size:14px}
.var-name-table th,.var-name-table td{padding:9px 10px;white-space:nowrap}
.var-name-table th{font-size:13.5px;font-weight:600}
.var-name-table td:first-child{font-size:14px;font-weight:600}
.var-name-table th:first-child,.var-name-table td:first-child{width:155px}
.var-name-table th:last-child,.var-name-table td:last-child{width:210px}
.var-name-table code{padding:0}
.var-rules-title{font-size:16.5px;font-weight:700}


@media (max-width:980px){
  .wrap{flex-direction:column}
  .sidebar{position:static;width:100%;flex:none;height:auto;border-right:none;
    border-bottom:1px solid var(--line);padding-bottom:10px}
  .sidebar.collapsed .navlabel,.sidebar.collapsed .toc{display:none}
  .main{padding:0 18px 60px} .page{padding-top:26px}
  h1{font-size:21px} h2{font-size:17px;margin-top:34px}
  .mobbar{display:block;margin:10px 18px 0;padding:7px 12px;border:1px solid var(--line);
    border-radius:4px;background:var(--paper);font-size:13px;cursor:pointer;color:var(--ink);font-family:var(--sans)}
  .picks{flex-direction:column}
  .compare-wide{width:100%}
  .compare-grid{grid-template-columns:1fr}
  .compare-card .scratch-crop{min-height:108px;height:auto}
  .rule-table th,.rule-table td{white-space:normal}
  .scratch-overview,.scratch-overview.scratch-build{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.compare-card .scratch-crop.scratch-stack img{max-width:290px;max-height:170px}
.morebox{margin:16px 0}
.morebox summary{font-size:14px}
@media (max-width:980px){.compare-card .scratch-crop.scratch-stack img{max-width:100%;max-height:none}}


/* 3장 전용: 인덱스·슬라이싱 도식 */
.idxtbl{width:100%;min-width:0;table-layout:fixed;font-size:11.5px}
.idxtbl th,.idxtbl td{text-align:center;white-space:nowrap;padding:7px 2px;min-width:0}
.idxtbl th{width:86px;white-space:normal;line-height:1.35}
.memdiagram{margin:16px 0 12px;padding:12px;border:1px solid var(--line);background:#f8fafc}
.memlookup{display:grid;grid-template-columns:minmax(160px,.9fr) 32px minmax(0,2fr);gap:8px;align-items:stretch}
.memstage{min-width:0;height:100%;display:flex;flex-direction:column;border:1px solid #aebbd0;background:#fff;border-radius:7px;overflow:hidden}
.memstage-title{padding:7px 9px;background:#233375;color:#fff;font-size:12px;font-weight:700;text-align:center}
.memlist{display:grid;grid-template-rows:repeat(4,1fr);flex:1;gap:4px;padding:8px}
.memlist>div{display:grid;grid-template-columns:64px minmax(0,1fr);border:1px solid var(--line);background:#fff;font-size:11.5px;line-height:1.3}
.memlist>div b,.memlist>div span{display:flex;align-items:center;justify-content:center;min-width:0;padding:6px 5px}
.memlist>div b{border-right:1px solid var(--line)}
.memlist>div span{font-family:var(--mono);font-size:10.5px;white-space:nowrap}
.memlist .chosen{border-color:#d3ad3a;background:#fff8d9}
.memarrow{display:flex;align-items:center;justify-content:center;color:#4058aa;font-size:23px;font-weight:700}
.memchars{padding:8px;flex:1;display:flex;flex-direction:column;justify-content:center}
.memstring{margin-bottom:7px;text-align:center;font-size:11px;color:var(--muted)}
.charrow,.idxrow{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));min-width:0}
.charrow span,.idxrow span{text-align:center;padding:5px 0;border-right:1px solid var(--line);font-family:var(--mono);font-size:10px;line-height:1.2}
.charrow span:first-child,.idxrow span:first-child{border-left:1px solid var(--line)}
.charrow span{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.idxrow span{padding-top:4px;color:#4a568a;border-bottom:1px solid var(--line);background:#f8fafc}
.charrow .picked,.idxrow .picked{background:#fff6c7;color:#1d2e73;font-weight:700;box-shadow:inset 0 0 0 1px #263783}
.memnote{margin:8px 8px 9px;padding:6px 7px;border:1px solid var(--line);background:#f8fafc;text-align:center;font-size:10.5px;line-height:1.35}
.memresult{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:10px;font-family:var(--mono);font-size:14px;color:var(--ink)}
.memresult strong{padding:3px 9px;border:1px solid #d3ad3a;background:#fff8d9;border-radius:5px;font-weight:600}
.memcaption{margin:7px 0 0;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.45}
.slice-diagram{margin:12px 0 10px;padding:10px 12px;border:2px solid #18306b;border-radius:8px;background:#fff}
.slice-params{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.slice-param{overflow:hidden;border:1.5px solid #18306b;border-radius:7px;background:#fff;text-align:center}
.slice-param b{display:block;padding:7px 3px;background:#123266;color:#fff;font-size:14px}
.slice-param span{display:block;padding:8px 3px;background:#eef5ff;font-family:var(--mono);font-size:18px;color:#142e68}
.slice-title{text-align:center;margin:5px 0 8px;font-size:16px;font-weight:700;color:#18306b}
.slice-title code{padding:0;background:transparent;font-size:16px;color:inherit}
.slice-track{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));width:100%;margin:0 auto}
.slice-track span{display:flex;align-items:center;justify-content:center;min-width:0;font-family:var(--mono);color:#18306b}
.slice-track .letter{padding:7px 1px;border-top:1px solid #7f8aa2;border-right:1px solid #7f8aa2;border-bottom:1px solid #7f8aa2;background:#fff;font-size:17px}
.slice-track .letter.first{border-left:1px solid #7f8aa2}
.slice-track .number{padding:4px 1px 1px;font-size:12px}
.slice-track .take{background:#edf4ff}
.slice-rule{margin:10px 0 8px;text-align:center;font-size:14.5px;font-weight:700;color:#18306b}
.slice-result{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-size:16px}
.slice-result>code{padding:5px 9px;border:1.5px solid #18306b;background:#fff;color:#18306b}
.slice-result strong{padding:5px 10px;border:1.5px solid #18306b;background:#eef5ff;border-radius:5px}
.slice-result small{font-family:var(--sans);font-size:12px;font-weight:600;color:#18306b}
.end-diagram{margin:12px 0 10px}
.end-grid{display:grid;grid-template-columns:76px repeat(14,minmax(0,1fr));overflow:hidden;border:1.5px solid #6f7b99;border-radius:8px;background:#fff}

<script>

const P=[{"n": "3장", "t": "숫자와 문자열 다루기", "h": "<div class=\"banner\"><h1><span class=\"num\">3장</span>숫자와 문자열 다루기</h1></div><p class=\"lede\">2장에서는 입력한 값을 계산에 맞는 자료형으로 바꾸었다. 이번 장에서는 숫자로 계산하는 방법과 문자열에서 필요한 부분을 꺼내는 방법을 차례로 익힌다.</p><p>아래의 날짜에는 연도·월·일이 붙어 있다. 공부를 마친 뒤 이 날짜를 나누어 읽기 쉬운 문장으로 출력해 보자.</p><div class=\"out goalout\">날짜를 8자리로 입력하세요: 20270405\n2027년 04월 05일입니다.</div><div class=\"codewrap\"><div class=\"codehead\">이 장을 마치며 완성할 코드</div><pre><span class=\"b\">date</span> = <span class=\"f\">input</span>(<span class=\"s\">'날짜를 8자리로 입력하세요: '</span>)\n<span class=\"b\">year</span> = <span class=\"bl\" aria-label=\"학습 후 완성할 표현\"></span>\n<span class=\"b\">month</span> = <span class=\"bl\" aria-label=\"학습 후 완성할 표현\"></span>\n<span class=\"b\">day</span> = <span class=\"bl\" aria-label=\"학습 후 완성할 표현\"></span>\n\n<span class=\"f\">print</span>(<span class=\"s\">f'</span>{<span class=\"b\">year</span>}<span class=\"s\">년 </span>{<span class=\"b\">month</span>}<span class=\"s\">월 </span>{<span class=\"b\">day</span>}<span class=\"s\">일입니다.</span><span class=\"s\">'</span>)</pre></div><div class=\"note\"><div class=\"ttl\">학습 순서</div><p>숫자형 → 숫자 연산 → 문자열형 → 인덱싱 → 슬라이싱 → 날짜 출력 프로그램</p></div><p>날짜는 <code>YYYYMMDD</code> 형식의 올바른 8자리로 입력한다고 가정한다. 월과 일은 각각 두 자리로 쓴다. 예를 들어 4월 5일은 <code>0405</code>다.</p>"}, {"n": "3-1", "t": "숫자형 자료형", "h": "<div class=\"banner\"><h1><span class=\"num\">3-1</span>숫자형 자료형</h1></div><div class=\"ask\"><span class=\"who\">생각해 봅시다</span><code>12</code>, <code>12.0</code>, <code>'12'</code>는 모두 같은 자료형일까요?</div><p class=\"lede\">계산에 사용하는 숫자에도 자료형이 있다. 정수는 <code>int</code>, 소수 부분이 있는 수를 다룰 때는 주로 <code>float</code>를 사용한다.</p><h2><span class=\"qn\">1)</span>정수와 실수 구분하기</h2><div class=\"table-scroll\"><table class=\"rule-table\"><tr><th>자료형</th><th>뜻</th><th>예</th></tr><tr><td><code>int</code></td><td>정수</td><td><code>-3</code>, <code>0</code>, <code>12</code></td></tr><tr><td><code>float</code></td><td>실수형</td><td><code>2.5</code>, <code>12.0</code></td></tr></table></div><div class=\"predict\"><div class=\"ttl\">실행 결과를 예상해 봅시다</div><pre><span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">12</span>))\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">12.0</span>))\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">'12'</span>))</pre><details><summary>결과와 설명 확인</summary><div class=\"pair\" data-case=\"case-1\"><pre><span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">12</span>))\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">12.0</span>))\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">'12'</span>))</pre><div class=\"out\">&lt;class 'int'&gt;\n&lt;class 'float'&gt;\n&lt;class 'str'&gt;</div></div><p><code>12</code>와 <code>12.0</code>은 같은 크기의 수지만 자료형이 다르다. <code>'12'</code>는 숫자 모양의 문자열이다.</p></details></div><h2><span class=\"qn\">2)</span>소수가 포함된 입력 받기</h2><div class=\"pair\" data-case=\"case-2\"><pre><span class=\"b\">length</span> = <span class=\"f\">float</span>(<span class=\"f\">input</span>(<span class=\"s\">'끈의 길이(m): '</span>))\n<span class=\"f\">print</span>(<span class=\"b\">length</span> + <span class=\"s\">0.5</span>)</pre><div class=\"out\">끈의 길이(m): 2.4\n2.9</div></div><p><code>input()</code>의 결과인 문자열 <code>'2.4'</code>를 <code>float()</code>로 바꾼 뒤 계산한다. 소수가 필요한 입력을 <code>int()</code>로 바꾸면 안 된다.</p><h2><span class=\"qn\">3)</span>변환하려는 값 확인하기</h2><div class=\"pair\" data-case=\"case-3\"><pre><span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"s\">'12'</span>))\n<span class=\"f\">print</span>(<span class=\"f\">float</span>(<span class=\"s\">'12.5'</span>))\n<span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"s\">12.9</span>))</pre><div class=\"out\">12\n12.5\n12</div></div><div class=\"note\"><div class=\"ttl\">int()는 반올림하지 않는다</div><p><code>int(12.9)</code>는 소수 부분을 버려 <code>12</code>가 된다. <code>int(-12.9)</code>는 <code>-12</code>다. 반면 <code>int('12.9')</code>는 정수 모양의 문자열이 아니어서 <code>ValueError</code>가 발생한다.</p></div><h3>내 말로 설명하기</h3><p><b><code>float(input())</code>이 필요한 입력의 예를 하나 말해 보자.</b></p><details><summary>설명 확인</summary><p>키, 길이, 무게처럼 소수 부분까지 입력받아 계산할 때 사용할 수 있다. 숫자의 모양뿐 아니라 어떤 계산에 사용할지 함께 생각한다.</p></details>"}, {"n": "3-2", "t": "숫자로 계산하기", "h": "<div class=\"banner\"><h1><span class=\"num\">3-2</span>숫자로 계산하기</h1></div><div class=\"ask\"><span class=\"who\">생각해 봅시다</span><code>194</code>초는 몇 분 몇 초일까요? <code>/</code>, <code>//</code>, <code>%</code> 중 무엇을 써야 할까요?</div><p class=\"lede\">같은 두 수로 계산해 보면서 연산자마다 어떤 값을 만드는지 확인하자.</p><h2><span class=\"qn\">1)</span>계산 기호 읽기</h2><div class=\"table-scroll\"><table class=\"rule-table\"><tr><th>연산자</th><th>역할</th><th>예와 결과</th></tr><tr><td><code>+</code></td><td>덧셈</td><td><code>17 + 5 → 22</code></td></tr><tr><td><code>-</code></td><td>뺄셈</td><td><code>17 - 5 → 12</code></td></tr><tr><td><code>*</code></td><td>곱셈</td><td><code>17 * 5 → 85</code></td></tr><tr><td><code>/</code></td><td>나눗셈</td><td><code>17 / 5 → 3.4</code></td></tr><tr><td><code>//</code></td><td>정수 나눗셈 · 아래 참고</td><td><code>17 // 5 → 3</code></td></tr><tr><td><code>%</code></td><td>나머지</td><td><code>17 % 5 → 2</code></td></tr><tr><td><code>**</code></td><td>거듭제곱</td><td><code>2 ** 4 → 16</code></td></tr></table></div><h2><span class=\"qn\">2)</span>나눗셈·몫·나머지 비교하기</h2><div class=\"pair\" data-case=\"case-4\"><pre><span class=\"f\">print</span>(<span class=\"s\">17</span> / <span class=\"s\">5</span>)\n<span class=\"f\">print</span>(<span class=\"s\">17</span> // <span class=\"s\">5</span>)\n<span class=\"f\">print</span>(<span class=\"s\">17</span> % <span class=\"s\">5</span>)\n<span class=\"f\">print</span>(<span class=\"s\">18</span> / <span class=\"s\">6</span>)</pre><div class=\"out\">3.4\n3\n2\n3.0</div></div><p>양의 정수를 나눌 때 <code>//</code>는 몫을, <code>%</code>는 나머지를 구한다. <code>/</code>의 결과는 나누어떨어져도 <code>3.0</code>처럼 실수형이다.</p><div class=\"note\"><div class=\"ttl\">몫과 나머지로 다시 확인</div><p><code>17 = 5 × 3 + 2</code>다. 나누는 수에 몫을 곱한 뒤 나머지를 더하면 원래 수가 된다.</p></div><details><summary>더 알아보기 · 음수에서 //의 의미</summary><p><code>//</code>는 나눈 결과보다 크지 않은 쪽으로 내림한다. <code>-7 // 3</code>은 <code>-3</code>이다. 소수 부분만 버리는 <code>int(-7 / 3)</code>의 결과 <code>-2</code>와 구분하자. 나누는 수가 0이면 나눗셈을 할 수 없다.</p></details><h2><span class=\"qn\">3)</span>초를 분과 초로 바꾸기</h2><div class=\"predict\"><div class=\"ttl\">실행 결과를 예상해 봅시다</div><pre><span class=\"b\">seconds</span> = <span class=\"s\">194</span>\n<span class=\"f\">print</span>(<span class=\"b\">seconds</span> // <span class=\"s\">60</span>)\n<span class=\"f\">print</span>(<span class=\"b\">seconds</span> % <span class=\"s\">60</span>)</pre><details><summary>결과와 설명 확인</summary><div class=\"pair\" data-case=\"case-5\"><pre><span class=\"b\">seconds</span> = <span class=\"s\">194</span>\n<span class=\"f\">print</span>(<span class=\"b\">seconds</span> // <span class=\"s\">60</span>)\n<span class=\"f\">print</span>(<span class=\"b\">seconds</span> % <span class=\"s\">60</span>)</pre><div class=\"out\">3\n14</div></div><p>60초씩 묶은 개수가 분이고, 묶고 남은 값이 초다. 따라서 194초는 3분 14초다.</p></details></div><h3>한 줄 바꾸기</h3><p><code>seconds</code>를 <code>245</code>로 바꾸면 어떻게 될까?</p><details><summary>확인</summary><p>4분 5초가 된다. 몫과 나머지를 구하는 코드는 그대로 사용할 수 있다.</p></details><h2><span class=\"qn\">4)</span>계산 순서 확인하기</h2><div class=\"pair\" data-case=\"case-6\"><pre><span class=\"f\">print</span>(<span class=\"s\">2</span> + <span class=\"s\">3</span> * <span class=\"s\">4</span>)\n<span class=\"f\">print</span>((<span class=\"s\">2</span> + <span class=\"s\">3</span>) * <span class=\"s\">4</span>)\n<span class=\"f\">print</span>(<span class=\"s\">2</span> ** <span class=\"s\">3</span> * <span class=\"s\">4</span>)</pre><div class=\"out\">14\n20\n32</div></div><p>이 예제에서는 괄호 안을 먼저 계산하고, 거듭제곱, 곱셈·나눗셈, 덧셈·뺄셈 순으로 계산한다. 같은 우선순위의 곱셈·나눗셈은 왼쪽부터 계산한다.</p><details><summary>더 알아보기 · abs()와 round()</summary><div class=\"pair\" data-case=\"case-7\"><pre><span class=\"f\">print</span>(<span class=\"f\">abs</span>(-<span class=\"s\">8</span>))\n<span class=\"f\">print</span>(<span class=\"f\">round</span>(<span class=\"s\">7.846</span>, <span class=\"s\">2</span>))</pre><div class=\"out\">8\n7.85</div></div><p><code>abs()</code>는 절댓값을 구한다. <code>round(값, 2)</code>의 두 번째 인수는 소수점 아래 두 자리까지 반올림한다는 뜻이다.</p><div class=\"pair\" data-case=\"case-8\"><pre><span class=\"f\">print</span>(<span class=\"f\">round</span>(<span class=\"s\">8.0</span>, <span class=\"s\">2</span>))\n<span class=\"f\">print</span>(<span class=\"s\">f'</span>{<span class=\"s\">8.0</span>:<span class=\"s\">.2f</span>}<span class=\"s\">'</span>)</pre><div class=\"out\">8.0\n8.00</div></div><p><code>round()</code>는 반올림한 값을 돌려주고, <code>:.2f</code>는 출력할 때 소수점 아래 두 자리를 표시한다. 정확히 중간인 값은 가까운 짝수 쪽으로 반올림하므로 <code>round(2.5)</code>는 2, <code>round(3.5)</code>는 4다.</p></details><h3>내 말로 설명하기</h3><p><b>초를 분과 초로 나눌 때 왜 두 연산자가 필요할까?</b></p><details><summary>설명 확인</summary><p><code>//</code>는 완성된 60초 묶음의 개수를, <code>%</code>는 남은 초를 구하기 때문이다.</p></details>"}, {"n": "3-3", "t": "문자열 자료형", "h": "<div class=\"banner\"><h1><span class=\"num\">3-3</span>문자열 자료형</h1></div><div class=\"ask\"><span class=\"who\">생각해 봅시다</span><code>print(word)</code>와 <code>print('word')</code>는 왜 다른 결과를 낼까요?</div><p class=\"lede\">문자열은 글자가 순서대로 놓인 값이다. 코드에 문자열을 직접 적을 때는 따옴표로 감싼다.</p><h2><span class=\"qn\">1)</span>변수 이름과 글자 자체 구분하기</h2><div class=\"predict\"><div class=\"ttl\">실행 결과를 예상해 봅시다</div><pre><span class=\"b\">word</span> = <span class=\"s\">'안녕'</span>\n<span class=\"f\">print</span>(<span class=\"b\">word</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'word'</span>)</pre><details><summary>결과와 설명 확인</summary><div class=\"pair\" data-case=\"case-9\"><pre><span class=\"b\">word</span> = <span class=\"s\">'안녕'</span>\n<span class=\"f\">print</span>(<span class=\"b\">word</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'word'</span>)</pre><div class=\"out\">안녕\nword</div></div><p><code>word</code>는 저장된 값을 찾아오는 변수 이름이다. <code>'word'</code>는 네 글자로 된 문자열 자체다.</p></details></div><p>따옴표 안의 <code>'12'</code>도 문자열이다. 숫자로 계산하려면 앞에서 배운 자료형 변환이 필요하다.</p><h2><span class=\"qn\">2)</span>문자열 안에 따옴표 넣기</h2><div class=\"pair\" data-case=\"case-10\"><pre><span class=\"f\">print</span>(<span class=\"s\">\"It's Python!\"</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'그는 \"시작\"이라고 말했다.'</span>)</pre><div class=\"out\">It's Python!\n그는 \"시작\"이라고 말했다.</div></div><p>문자열 안에 작은따옴표를 넣을 때는 바깥을 큰따옴표로, 큰따옴표를 넣을 때는 바깥을 작은따옴표로 감싸면 편하다. 문자열을 시작한 따옴표와 끝내는 따옴표는 짝이 맞아야 한다.</p><details><summary>더 알아보기 · 이스케이프 문자와 여러 줄 문자열</summary><div class=\"pair\" data-case=\"case-11\"><pre><span class=\"f\">print</span>(<span class=\"s\">'It\\'s Python!'</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'첫째 줄\\n둘째 줄'</span>)</pre><div class=\"out\">It's Python!\n첫째 줄\n둘째 줄</div></div><p><code>\\'</code>는 문자열 안의 작은따옴표, <code>\\n</code>은 줄바꿈, <code>\\\\</code>는 역슬래시 한 개를 나타낸다. 역슬래시는 일부 글꼴에서 원화 기호처럼 보일 수 있다.</p><div class=\"pair\" data-case=\"case-12\"><pre><span class=\"b\">message</span> = <span class=\"s\">\"\"\"첫째 줄\n둘째 줄\"\"\"</span>\n<span class=\"f\">print</span>(<span class=\"b\">message</span>)</pre><div class=\"out\">첫째 줄\n둘째 줄</div></div><p>따옴표 세 개로 감싸면 실제 줄바꿈을 포함한 문자열도 만들 수 있다.</p></details><h2><span class=\"qn\">3)</span>2장에서 배운 연결과 반복 확인하기</h2><div class=\"pair\" data-case=\"case-13\"><pre><span class=\"f\">print</span>(<span class=\"s\">6</span> + <span class=\"s\">4</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'6'</span> + <span class=\"s\">'4'</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'Go'</span> * <span class=\"s\">3</span>)</pre><div class=\"out\">10\n64\nGoGoGo</div></div><p>문자열의 <code>+</code>는 연결이고, <code>* 정수</code>는 반복이다. <code>'Go' * 3</code>은 <code>'Go' + 'Go' + 'Go'</code>와 같은 문자열을 만든다.</p><h2><span class=\"qn\">4)</span>먼저 연결할까, 먼저 숫자로 바꿀까</h2><div class=\"pair\" data-case=\"case-14\"><pre><span class=\"b\">a</span> = <span class=\"s\">'6'</span>\n<span class=\"b\">b</span> = <span class=\"s\">'24'</span>\n<span class=\"f\">print</span>(<span class=\"b\">a</span> + <span class=\"b\">b</span>)\n<span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"b\">a</span> + <span class=\"b\">b</span>))\n<span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"b\">a</span>) + <span class=\"f\">int</span>(<span class=\"b\">b</span>))</pre><div class=\"out\">624\n624\n30</div></div><div class=\"table-scroll\"><table class=\"explain-table\"><tr><th>표현</th><th>실행 순서</th></tr><tr><td><code>int(a + b)</code></td><td>문자열을 연결해 <code>'624'</code>를 만든 뒤 정수 624로 바꾼다.</td></tr><tr><td><code>int(a) + int(b)</code></td><td>6과 24를 각각 정수로 바꾼 뒤 더한다.</td></tr></table></div><h3>내 말로 설명하기</h3><p><b>문자열을 연결한 뒤 int()로 바꾸는 것과 각각 바꾸어 더하는 것은 왜 다를까?</b></p><details><summary>설명 확인</summary><p>연결은 글자를 붙이는 것이고, 숫자의 덧셈은 크기를 더하는 것이기 때문이다. 괄호가 어느 부분을 감싸는지 먼저 읽어야 한다.</p></details>"}, {"n": "3-4", "t": "인덱싱으로 한 글자 꺼내기", "h": "<div class=\"banner\"><h1><span class=\"num\">3-4</span>인덱싱으로 한 글자 꺼내기</h1></div><div class=\"ask\"><span class=\"who\">생각해 봅시다</span>문자열의 첫 글자와 마지막 글자를 각각 꺼내려면 어떤 위치 번호를 써야 할까요?</div>\n<p class=\"lede\"><b>인덱싱(Indexing)</b>은 문자열의 위치 번호를 이용해 특정 글자 하나를 꺼내는 방법이다.</p>\n<h2><span class=\"qn\">1)</span>스크래치는 첫 글자를 1번째로 센다</h2>\n<p>변수 <code>a</code>에 <code>Python is fun!</code>을 저장하고 스크래치의 ‘○번째 글자’ 블록으로 1번째와 9번째 글자를 확인해 보자.</p>\n<div class=\"scratch-observe\">\n<div class=\"scratch-shot\">\n<img alt=\"스크래치에서 1번째 글자 P를 출력한 화면\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/2wBDAAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQH/2wBDAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQH/wAARCAMyA9MDASEAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NT vQAeV/s/r/9ejyv9n9f/r0AHlf7P6//AF6PK/2f1/8Ar0AHlf7P6/8A16PK/wBn9f8A69AB5X+z+v8A9ejyv9n9f/r0AHlf7P6//Xo8r/Z/X/69AB5X+z+v/wBejyv9n9f/AK9AB5X+z+v/ANejyv8AZ/X/AOvQAeV/s/r/APXo8r/Z/X/69AB5X+z+v/16PK/2f1/+vQAeV/s/r/8AXpwQ8DGBnnkcCgB+wep/T/CnAADAoAWigAooAKKACigBpUHtj6cVC0ec5GR6j0/z65oArvArZyAe/of6/wBM96qSWanOQOvp1xxx06euTx9aAK7WCn+EZ9RzwPUAUz+z19P0P+FAD1sVH8PPr04/EY/rVlLQDHHQntxzzgjpjPPUdqALawKp5H19c+hz9ffuKsLH6DAPf/JzQBKFA9/rg/0p1ABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFABRQAUUAFFAEHY/UfyakoAXsfqP5NVdup+p/nQBPRQAVYoAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKACigAooAKKAP/9k=\"/></div>\n</div>\n<div class=\"compare-card\">\n<div class=\"cttl\">파이썬</div>\n<div class=\"pair\">\n<pre><span class=\"b\">a</span> = <span class=\"s\">'Python is fun!'</span>\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">8</span>])</pre>\n<div class=\"out\">s</div>\n</div>\n</div>\n</div>\n<div class=\"compare-note\"><b>같은 결과:</b> 스크래치의 9번째 글자 <code>s</code>는 파이썬에서 인덱스 <code>8</code>이다.</div>\n</div>\n<h2><span class=\"qn\">3)</span>인덱스는 문자열 안의 위치 번호다</h2>\n<p>문자열의 각 글자에 순서대로 붙은 위치 번호를 <b>인덱스</b>라고 한다. 앞에서 셀 때는 <code>0</code>부터, 뒤에서 셀 때는 <code>-1</code>부터 시작한다.</p>\n<div style=\"overflow-x:auto\">\n<table class=\"idxtbl\">\n<tr><th>글자</th><td>P</td><td>y</td><td>t</td><td>h</td><td>o</td><td>n</td><td>공백</td><td>i</td><td>s</td><td>공백</td><td>f</td><td>u</td><td>n</td><td>!</td></tr>\n<tr><th>앞에서 세는 인덱스</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td><td>13</td></tr>\n<tr><th>음수 인덱스</th><td>-14</td><td>-13</td><td>-12</td><td>-11</td><td>-10</td><td>-9</td><td>-8</td><td>-7</td><td>-6</td><td>-5</td><td>-4</td><td>-3</td><td>-2</td><td>-1</td></tr>\n</table>\n</div>\n<div class=\"note\"><div class=\"ttl\">공백도 한 글자</div><p>문자열 안의 공백도 다른 글자와 마찬가지로 인덱스를 하나 가진다. <code>Python is fun!</code>에서 6번과 9번은 공백이다.</p></div>\n<div class=\"pair\">\n<pre><span class=\"b\">a</span> = <span class=\"s\">'Python is fun!'</span>\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">0</span>])\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">8</span>])\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">-1</span>])</pre>\n<div class=\"out\">P\ns\n!</div>\n</div>\n<h2><span class=\"qn\">4)</span><code>a[8]</code>은 어떻게 글자를 찾을까</h2>\n<p>컴퓨터는 먼저 변수 이름 <code>a</code>가 가리키는 문자열을 찾고, 그 문자열에서 인덱스 8번 위치의 글자를 선택한다.</p>\n<div aria-label=\"변수 a가 가리키는 문자열에서 인덱스 8번 글자 s를 찾는 과정\" class=\"memdiagram\">\n<div class=\"memlookup\">\n<div class=\"memstage\">\n<div class=\"memstage-title\">1단계: 변수 이름으로 찾기</div>\n<div class=\"memlist\">\n<div><b>name</b><span>'한다인'</span></div>\n<div><b>age</b><span>17</span></div>\n<div><b>b</b><span>'Hello'</span></div>\n<div class=\"chosen\"><b>a</b><span>'Python is fun!'</span></div>\n</div>\n</div>\n<div aria-hidden=\"true\" class=\"memarrow\">→</div>\n<div class=\"memstage\">\n<div class=\"memstage-title\">2단계: 인덱스 8번 찾기</div>\n<div class=\"memchars\">\n<div class=\"memstring\"><code>a</code>가 가리키는 문자열</div>\n<div class=\"charrow\"><span>P</span><span>y</span><span>t</span><span>h</span><span>o</span><span>n</span><span>공백</span><span>i</span><span class=\"picked\">s</span><span>공백</span><span>f</span><span>u</span><span>n</span><span>!</span></div>\n<div class=\"idxrow\"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span class=\"picked\">8</span><span>9</span><span>10</span><span>11</span><span>12</span><span>13</span></div>\n</div>\n<div class=\"memnote\">인덱스는 0부터 시작하며 공백도 한 글자다.</div>\n</div>\n</div>\n<div class=\"memresult\"><code>a[8]</code><span>→</span><strong><code>'s'</code></strong></div>\n<p class=\"memcaption\">변수 이름 <code>a</code> 찾기 → 문자열 찾기 → 인덱스 8번 글자 가져오기</p>\n</div>\n<p><code>a</code>는 어느 문자열을 사용할지 알려주고, <code>[8]</code>은 그 문자열의 어느 글자를 선택할지 알려준다.</p>\n<h2><span class=\"qn\">5)</span>뒤에서 세는 음수 인덱스</h2>\n<p>마지막 글자는 <code>-1</code>, 마지막에서 두 번째 글자는 <code>-2</code>처럼 뒤에서 셀 수 있다.</p>\n<div class=\"pair\">\n<pre><span class=\"b\">a</span> = <span class=\"s\">'Python is fun!'</span>\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">8</span>])\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">-6</span>])</pre>\n<div class=\"out\">s\ns</div>\n</div>\n<p>같은 글자 <code>s</code>를 앞에서는 <code>8</code>, 뒤에서는 <code>-6</code>으로 가리킬 수 있다.</p>\n<h2><span class=\"qn\">6)</span>없는 위치를 가리키면 오류가 난다</h2>\n<div class=\"pair\">\n<pre><span class=\"b\">a</span> = <span class=\"s\">'안녕하세요'</span>\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">5</span>])</pre>\n<div class=\"out\">IndexError: string index out of range</div>\n</div>\n<p><code>안녕하세요</code>의 인덱스는 <code>0~4</code>다. 없는 5번 위치를 인덱싱하면 <code>IndexError</code>가 발생한다.</p>\n<h2><span class=\"qn\">7)</span>문자열 길이와 마지막 인덱스</h2><div class=\"pair\" data-case=\"case-15\"><pre><span class=\"b\">word</span> = <span class=\"s\">'robot'</span>\n<span class=\"f\">print</span>(<span class=\"f\">len</span>(<span class=\"b\">word</span>))\n<span class=\"f\">print</span>(<span class=\"b\">word</span>[<span class=\"s\">4</span>])\n<span class=\"f\">print</span>(<span class=\"b\">word</span>[-<span class=\"s\">1</span>])</pre><div class=\"out\">5\nt\nt</div></div><p><code>len(word)</code>는 글자 수 5를 돌려준다. 인덱스는 0부터 세므로 앞에서 세는 마지막 인덱스는 4, 즉 <code>len(word) - 1</code>이다.</p><div class=\"note\"><div class=\"ttl\">빈 문자열과 생략 구분하기</div><p><code>''</code>는 글자가 하나도 없는 빈 문자열이고 길이는 0이다. 인덱싱에서는 <code>word[0]</code>의 0을 빼서 <code>word[]</code>로 쓸 수 없다. 인덱스가 빠진 이 표현은 문법 오류다. 범위를 생략하는 슬라이싱 <code>word[:]</code>와 구분하자.</p></div><h2><span class=\"qn\">8)</span>오류가 나기 전에는 어디까지 실행될까</h2><div class=\"predict\"><div class=\"ttl\">실행 결과를 예상해 봅시다</div><pre><span class=\"b\">word</span> = <span class=\"s\">'robot'</span>\n<span class=\"f\">print</span>(<span class=\"b\">word</span>[<span class=\"s\">0</span>])\n<span class=\"f\">print</span>(<span class=\"b\">word</span>[<span class=\"s\">5</span>])\n<span class=\"f\">print</span>(<span class=\"s\">'완료'</span>)</pre><details><summary>결과와 설명 확인</summary><div class=\"pair\" data-case=\"case-16\"><pre><span class=\"b\">word</span> = <span class=\"s\">'robot'</span>\n<span class=\"f\">print</span>(<span class=\"b\">word</span>[<span class=\"s\">0</span>])\n<span class=\"f\">print</span>(<span class=\"b\">word</span>[<span class=\"s\">5</span>])\n<span class=\"f\">print</span>(<span class=\"s\">'완료'</span>)</pre><div class=\"out\">r\nIndexError: string index out of range</div></div><p>첫 번째 출력은 실행된다. 다음 줄의 인덱스 5는 범위를 벗어나므로 <code>IndexError</code>가 발생하고 마지막 출력문은 실행되지 않는다. 여기서는 문법이 올바른 코드에서 실행 도중 발생하는 오류를 다룬다.</p></details></div><h3>내 말로 설명하기</h3><p><b><code>a[8]</code>에서 변수 이름과 대괄호 안의 번호는 각각 어떤 역할을 할까?</b></p><details><summary>설명 확인</summary><p><code>a</code>로 대상 문자열을 찾고, <code>[8]</code>로 그 문자열 안의 한 글자를 선택한다. 인덱스는 문자열 안의 위치 번호다.</p></details><div class=\"key\"><div class=\"ttl\">이것만 기억하자</div><ul>\n<li>인덱싱은 위치 번호로 문자열의 한 글자를 꺼낸다</li>\n<li>파이썬의 첫 번째 글자 인덱스는 <code>0</code>이다</li>\n<li>뒤에서 셀 때는 <code>-1</code>부터 시작한다</li>\n<li>없는 위치를 인덱싱하면 <code>IndexError</code>가 발생한다</li>\n</ul></div>\n"}, {"n": "3-5", "t": "슬라이싱으로 필요한 부분 꺼내기", "h": "<div class=\"banner\"><h1><span class=\"num\">3-5</span>슬라이싱으로 필요한 부분 꺼내기</h1></div><div class=\"ask\"><span class=\"who\">생각해 봅시다</span><code>Python</code>을 꺼내려면 끝 위치에 5를 써야 할까요, 6을 써야 할까요?</div>\n<p class=\"lede\"><b>슬라이싱(Slicing)</b>은 문자열에서 필요한 범위를 잘라 여러 글자로 된 새로운 문자열을 만드는 방법이다.</p>\n<h2><span class=\"qn\">1)</span>슬라이싱에 필요한 네 가지 값</h2>\n<p>아래는 슬라이싱 동작을 미리 구현해 둔 관찰용 <code>slicing</code> 추가 블록이다. 그림은 이 블록이 받는 입력값을 보여준다. 대상 문자열, 시작 위치, 끝 위치, 이동 간격을 입력값으로 받는다.</p>\n<figure class=\"scratch-def\"><img alt=\"slicing 추가 블록 정의\" class=\"block-compare-img\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/2wBDAAEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE </div>\n<div class=\"slice-title\"><code>a[0:6:1]</code>이 읽는 위치</div>\n<div class=\"slice-track\">\n<span class=\"letter first take\">P</span><span class=\"letter take\">y</span><span class=\"letter take\">t</span><span class=\"letter take\">h</span><span class=\"letter take\">o</span><span class=\"letter take\">n</span><span class=\"letter\"> </span><span class=\"letter\">i</span><span class=\"letter\">s</span><span class=\"letter\"> </span><span class=\"letter\">f</span><span class=\"letter\">u</span><span class=\"letter\">n</span><span class=\"letter\">!</span>\n<span class=\"number\">0</span><span class=\"number\">1</span><span class=\"number\">2</span><span class=\"number\">3</span><span class=\"number\">4</span><span class=\"number\">5</span><span class=\"number\">6</span><span class=\"number\">7</span><span class=\"number\">8</span><span class=\"number\">9</span><span class=\"number\">10</span><span class=\"number\">11</span><span class=\"number\">12</span><span class=\"number\">13</span>\n</div>\n<div class=\"slice-rule\">0번 포함 → 1칸씩 이동 → 6번 직전에 멈춤</div>\n<div class=\"slice-result\"><code>a[0:6:1]</code><span>→</span><strong><code>'Python'</code></strong><small>새 문자열</small></div>\n</div>\n<h2><span class=\"qn\">4)</span><code>end</code> 위치는 왜 포함하지 않을까</h2>\n<p><code>Python</code>을 가져오려면 0번부터 5번까지 선택해야 한다. <code>end</code>에는 마지막으로 가져올 글자의 번호가 아니라 <b>가져오기를 멈출 위치</b>를 적는다.</p>\n<div class=\"end-diagram\">\n<div class=\"end-grid\">\n<div class=\"label\">글자</div><div class=\"take\">P</div><div class=\"take\">y</div><div class=\"take\">t</div><div class=\"take\">h</div><div class=\"take\">o</div><div class=\"take\">n</div><div class=\"boundary\">공백</div><div>i</div><div>s</div><div>공백</div><div>f</div><div>u</div><div>n</div><div>!</div>\n<div class=\"label\">인덱스</div><div class=\"take\">0</div><div class=\"take\">1</div><div class=\"take\">2</div><div class=\"take\">3</div><div class=\"take\">4</div><div class=\"take\">5</div><div class=\"boundary\">6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div>\n<div class=\"label\">역할</div><div class=\"role-take\"><span>결과에 포함<br/><small>0번부터 5번까지</small></span></div><div class=\"role-stop\"><span>여기서 멈춤<br/><small>6번부터 포함하지 않음</small></span></div>\n</div>\n<div class=\"end-calc\"><b>이 예제에서 가져오는 글자 수</b><code>end - start = 6 - 0 = 6개</code></div>\n</div>\n<p>따라서 <code>a[0:6]</code>은 0번부터 5번까지 여섯 글자를 가져온다. 이 예제에서는 시작과 끝이 문자열 길이 안에 있고 간격이 1이므로 <code>6 - 0 = 6</code>으로 글자 수를 구할 수 있다. 범위를 벗어나거나 시작이 끝보다 뒤인 경우에 이 계산을 그대로 적용하면 안 된다.</p>\n<h2><span class=\"qn\">5)</span>시작·끝·간격 생략하기</h2><div class=\"pair\" data-case=\"case-17\"><pre><span class=\"b\">a</span> = <span class=\"s\">'Python is fun!'</span>\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[:<span class=\"s\">6</span>])\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">10</span>:])\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[:])\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[::<span class=\"s\">2</span>])</pre><div class=\"out\">Python\nfun!\nPython is fun!\nPto sfn</div></div><div class=\"table-scroll\"><table class=\"explain-table\"><tr><th>형태</th><th>읽는 방법</th></tr><tr><td><code>a[:6]</code></td><td>처음부터 6번 직전까지</td></tr><tr><td><code>a[10:]</code></td><td>10번부터 마지막까지</td></tr><tr><td><code>a[:]</code></td><td>처음부터 마지막까지</td></tr><tr><td><code>a[::2]</code></td><td>처음부터 마지막까지 두 칸씩 이동</td></tr></table></div><p>여기서는 간격이 양수다. 간격을 적으려면 <b>콜론 두 개</b>로 세 번째 칸을 표시해야 한다. <code>a[:2]</code>의 2는 끝 위치이고, <code>a[::2]</code>의 2는 간격이다.</p><details><summary>더 알아보기 · 문자열 거꾸로 읽기</summary><div class=\"pair\" data-case=\"case-18\"><pre><span class=\"b\">a</span> = <span class=\"s\">'robot'</span>\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[::-<span class=\"s\">1</span>])</pre><div class=\"out\">tobor</div></div><p><code>step=-1</code>은 뒤에서 앞으로 한 칸씩 이동한다. 이때 시작과 끝을 생략하면 마지막 글자부터 첫 글자까지 가져온다. 음수 인덱스는 <b>위치</b>이고 음수 간격은 <b>이동 방향</b>이라는 점을 구분하자.</p></details><h2><span class=\"qn\">6)</span>범위가 문자열 길이를 넘어가면</h2><div class=\"pair\" data-case=\"case-19\"><pre><span class=\"b\">a</span> = <span class=\"s\">'robot'</span>\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[:<span class=\"s\">100</span>])\n<span class=\"f\">print</span>(<span class=\"b\">a</span>[<span class=\"s\">4</span>:<span class=\"s\">1</span>])\n<span class=\"f\">print</span>(<span class=\"f\">len</span>(<span class=\"b\">a</span>[<span class=\"s\">4</span>:<span class=\"s\">1</span>]))</pre><div class=\"out\">robot\n\n0</div></div><p>슬라이싱은 범위가 끝을 넘어가도 존재하는 부분까지만 가져온다. 간격이 양수인데 시작이 끝보다 뒤인 <code>a[4:1]</code>의 결과는 빈 문자열이다. 그래서 두 번째 출력은 빈 줄이다.</p><h2><span class=\"qn\">7)</span>꺼낸 결과도 문자열이다</h2><div class=\"pair\" data-case=\"case-20\"><pre><span class=\"b\">code</span> = <span class=\"s\">'A24B'</span>\n<span class=\"b\">number</span> = <span class=\"b\">code</span>[<span class=\"s\">1</span>:<span class=\"s\">3</span>]\n<span class=\"f\">print</span>(<span class=\"b\">number</span>)\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"b\">number</span>))\n<span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"b\">number</span>) + <span class=\"s\">6</span>)\n<span class=\"f\">print</span>(<span class=\"b\">code</span>)</pre><div class=\"out\">24\n&lt;class 'str'&gt;\n30\nA24B</div></div><p>슬라이싱으로 꺼낸 <code>'24'</code>는 문자열이다. 숫자 계산에는 <code>int(number)</code>를 사용한다. 슬라이싱을 해도 원래 문자열 <code>code</code>는 바뀌지 않는다.</p><h3>내 말로 설명하기</h3><p><b><code>a[:2]</code>와 <code>a[::2]</code>의 결과는 왜 다를까?</b></p><details><summary>설명 확인</summary><p>콜론 한 개 뒤의 2는 끝 위치다. 콜론 두 개 뒤의 2는 간격이다. 숫자가 들어간 칸의 역할부터 읽어야 한다.</p></details><div class=\"key\"><div class=\"ttl\">이것만 기억하자</div><ul><li>슬라이싱은 <code>문자열[start:end:step]</code> 형태다.</li><li>끝 위치는 결과에 포함하지 않는다.</li><li>간격을 생략하면 1이고, 간격으로 0을 사용할 수는 없다.</li><li>슬라이싱한 결과를 사용해도 원래 문자열은 그대로다.</li></ul></div>"}, {"n": "3-6", "t": "날짜 출력 프로그램 완성하기", "h": "<div class=\"banner\"><h1><span class=\"num\">3-6</span>날짜 출력 프로그램 완성하기</h1></div><div class=\"ask\"><span class=\"who\">생각해 봅시다</span>숫자만 있는 날짜인데도 왜 문자열로 입력받아야 할까요?</div><p class=\"lede\">장 도입에서 본 날짜를 이제 직접 나누어 보자. 날짜는 계산할 수가 아니라 연도·월·일의 자리가 정해진 문자열로 다룬다.</p><h2><span class=\"qn\">1)</span>문자와 인덱스를 나란히 보기</h2><div class=\"table-scroll\"><table class=\"date-index\"><tr><th>구분</th><th>2</th><th>0</th><th>2</th><th>7</th><th>0</th><th>4</th><th>0</th><th>5</th></tr><tr><td>인덱스</td><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr></table></div><div class=\"table-scroll\"><table class=\"\"><tr><th>구분</th><th>위치</th><th>표현</th><th>결과</th></tr><tr><td>연도</td><td>0~3번</td><td><code>date[:4]</code></td><td><code>'2027'</code></td></tr><tr><td>월</td><td>4~5번</td><td><code>date[4:6]</code></td><td><code>'04'</code></td></tr><tr><td>일</td><td>6~7번</td><td><code>date[6:]</code></td><td><code>'05'</code></td></tr></table></div><p>연도를 꺼낼 때 끝 위치가 4이고 월을 꺼낼 때 시작 위치도 4다. 연도 범위는 4번을 포함하지 않고, 월 범위는 4번부터 시작하기 때문이다.</p><h2><span class=\"qn\">2)</span>처음의 프로그램 완성하기</h2><div class=\"pair\" data-case=\"case-21\"><pre><span class=\"b\">date</span> = <span class=\"f\">input</span>(<span class=\"s\">'날짜를 8자리로 입력하세요: '</span>)\n<span class=\"b\">year</span> = <span class=\"b\">date</span>[:<span class=\"s\">4</span>]\n<span class=\"b\">month</span> = <span class=\"b\">date</span>[<span class=\"s\">4</span>:<span class=\"s\">6</span>]\n<span class=\"b\">day</span> = <span class=\"b\">date</span>[<span class=\"s\">6</span>:]\n\n<span class=\"f\">print</span>(<span class=\"s\">f'</span>{<span class=\"b\">year</span>}<span class=\"s\">년 </span>{<span class=\"b\">month</span>}<span class=\"s\">월 </span>{<span class=\"b\">day</span>}<span class=\"s\">일입니다.</span><span class=\"s\">'</span>)</pre><div class=\"out\">날짜를 8자리로 입력하세요: 20270405\n2027년 04월 05일입니다.</div></div><h2><span class=\"qn\">3)</span>여기서는 왜 int()를 쓰지 않을까</h2><p>이 프로그램은 연도·월·일을 계산하지 않고 자리를 나누어 출력한다. 문자열로 유지하면 <code>'04'</code>와 <code>'05'</code>의 앞자리 0도 그대로 남는다.</p><div class=\"pair\" data-case=\"case-22\"><pre><span class=\"b\">month</span> = <span class=\"s\">'04'</span>\n<span class=\"f\">print</span>(<span class=\"b\">month</span>)\n<span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"b\">month</span>))</pre><div class=\"out\">04\n4</div></div><h2><span class=\"qn\">4)</span>한 줄 바꾸어 출력 형식 바꾸기</h2><div class=\"pair\" data-case=\"case-23\"><pre><span class=\"b\">date</span> = <span class=\"s\">'20270405'</span>\n<span class=\"f\">print</span>(<span class=\"s\">f'</span>{<span class=\"b\">date</span>[<span class=\"s\">6</span>:]}<span class=\"s\">-</span>{<span class=\"b\">date</span>[<span class=\"s\">4</span>:<span class=\"s\">6</span>]}<span class=\"s\">-</span>{<span class=\"b\">date</span>[:<span class=\"s\">4</span>]}<span class=\"s\">'</span>)</pre><div class=\"out\">05-04-2027</div></div><h3>내 말로 설명하기</h3><p><b>날짜를 입력받자마자 int()로 바꾸면 슬라이싱할 수 있을까?</b></p><details><summary>설명 확인</summary><p>정수에는 문자열의 글자 위치를 선택하는 슬라이싱을 사용할 수 없다. 날짜의 자리를 나누는 동안에는 문자열로 유지한다. 이 프로그램은 올바른 8자리 날짜를 입력한다고 가정한다.</p></details>"}, {"n": "3-7", "t": "마무리 점검", "h": "<div class=\"banner\"><h1><span class=\"num\">3-7</span>마무리 점검</h1></div><p class=\"lede\">숫자와 문자열을 구분하고, 코드가 실행되는 순서대로 결과를 예상해 보자.</p><p class=\"blhint\">빈칸을 누르면 해당 문제의 보기만 나타난다. 정답을 펼치면 완성 코드와 실행 결과를 확인할 수 있다.</p><div class=\"checkitem\" data-question=\"c3q1\"><h3>1. 자료형 구분하기</h3><p class=\"qdesc\">세 줄의 자료형이 순서대로 나열된 보기를 고르시오.</p><div class=\"codewrap\"><pre><span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">8</span>))\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">8.0</span>))\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">'8'</span>))</pre></div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① int / int / str</span><span class=\"chip\">② int / float / str</span><span class=\"chip\">③ float / float / int</span><span class=\"chip\">④ str / float / int</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ②</b></p><div class=\"pair\" data-case=\"case-24\"><pre><span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">8</span>))\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">8.0</span>))\n<span class=\"f\">print</span>(<span class=\"f\">type</span>(<span class=\"s\">'8'</span>))</pre><div class=\"out\">&lt;class 'int'&gt;\n&lt;class 'float'&gt;\n&lt;class 'str'&gt;</div></div><p class=\"answhy\">숫자 모양이 같아도 따옴표와 소수점 표기에 따라 자료형이 달라진다.</p></details></div><div class=\"checkitem\" data-question=\"c3q2\"><h3>2. 초를 분과 초로 나누기</h3><p class=\"qdesc\">245초를 분과 초로 나누어 출력하도록 빈칸을 완성하시오.</p><div class=\"codewrap\"><pre>seconds = 245\nprint(seconds <span class=\"bl\" data-bank=\"c3q2\" data-a=\"1\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 1 보기 선택\"></span> 60)\nprint(seconds <span class=\"bl\" data-bank=\"c3q2\" data-a=\"2\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 2 보기 선택\"></span> 60)</pre></div><div class=\"out goalout\">4\n5</div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① //</span><span class=\"chip\">② %</span><span class=\"chip\">③ /</span><span class=\"chip\">④ *</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ①, ②</b></p><div class=\"pair\" data-case=\"case-25\"><pre><span class=\"b\">seconds</span> = <span class=\"s\">245</span>\n<span class=\"f\">print</span>(<span class=\"b\">seconds</span> // <span class=\"s\">60</span>)\n<span class=\"f\">print</span>(<span class=\"b\">seconds</span> % <span class=\"s\">60</span>)</pre><div class=\"out\">4\n5</div></div><p class=\"answhy\">몫은 분, 나머지는 남은 초를 나타낸다.</p></details></div><div class=\"checkitem\" data-question=\"c3q3\"><h3>3. 변수 이름과 문자열 구분하기</h3><p class=\"qdesc\">실행 결과로 알맞은 것을 고르시오.</p><div class=\"codewrap\"><pre><span class=\"b\">word</span> = <span class=\"s\">'Go'</span>\n<span class=\"f\">print</span>(<span class=\"b\">word</span> * <span class=\"s\">2</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'word'</span>)</pre></div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① GoGo / word</span><span class=\"chip\">② wordword / Go</span><span class=\"chip\">③ GoGo / Go</span><span class=\"chip\">④ 오류 발생</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ①</b></p><div class=\"pair\" data-case=\"case-26\"><pre><span class=\"b\">word</span> = <span class=\"s\">'Go'</span>\n<span class=\"f\">print</span>(<span class=\"b\">word</span> * <span class=\"s\">2</span>)\n<span class=\"f\">print</span>(<span class=\"s\">'word'</span>)</pre><div class=\"out\">GoGo\nword</div></div><p class=\"answhy\">첫 줄은 변수의 값을 두 번 반복하고, 둘째 줄은 따옴표 안의 글자를 그대로 출력한다.</p></details></div><div class=\"checkitem\" data-question=\"c3q4\"><h3>4. 첫 글자와 마지막 글자</h3><p class=\"qdesc\">실행 결과로 알맞은 것을 고르시오.</p><div class=\"codewrap\"><pre><span class=\"b\">text</span> = <span class=\"s\">'Code time!'</span>\n<span class=\"f\">print</span>(<span class=\"b\">text</span>[<span class=\"s\">0</span>], <span class=\"b\">text</span>[-<span class=\"s\">1</span>])</pre></div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① C !</span><span class=\"chip\">② o !</span><span class=\"chip\">③ C e</span><span class=\"chip\">④ 오류 발생</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ①</b></p><div class=\"pair\" data-case=\"case-27\"><pre><span class=\"b\">text</span> = <span class=\"s\">'Code time!'</span>\n<span class=\"f\">print</span>(<span class=\"b\">text</span>[<span class=\"s\">0</span>], <span class=\"b\">text</span>[-<span class=\"s\">1</span>])</pre><div class=\"out\">C !</div></div><p class=\"answhy\">첫 글자는 인덱스 0, 마지막 글자는 인덱스 -1이다. print()의 쉼표로 두 값을 출력하면 사이에 공백이 들어간다.</p></details></div><div class=\"checkitem\" data-question=\"c3q5\"><h3>5. 필요한 단어 꺼내기</h3><p class=\"qdesc\">생략할 수 있는 시작·끝 위치는 생략하여 완성하시오.</p><div class=\"codewrap\"><pre>text = 'Silver robot'\nprint(text[<span class=\"bl\" data-bank=\"c3q5\" data-a=\"1\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 1 보기 선택\"></span>:<span class=\"bl\" data-bank=\"c3q5\" data-a=\"2\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 2 보기 선택\"></span>])\nprint(text[<span class=\"bl\" data-bank=\"c3q5\" data-a=\"3\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 3 보기 선택\"></span>:<span class=\"bl\" data-bank=\"c3q5\" data-a=\"1\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 4 보기 선택\"></span>])</pre></div><div class=\"out goalout\">Silver\nrobot</div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① 생략</span><span class=\"chip\">② 6</span><span class=\"chip\">③ 7</span><span class=\"chip\">④ 5</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ①, ②, ③, ①</b></p><div class=\"pair\" data-case=\"case-28\"><pre><span class=\"b\">text</span> = <span class=\"s\">'Silver robot'</span>\n<span class=\"f\">print</span>(<span class=\"b\">text</span>[:<span class=\"s\">6</span>])\n<span class=\"f\">print</span>(<span class=\"b\">text</span>[<span class=\"s\">7</span>:])</pre><div class=\"out\">Silver\nrobot</div></div><p class=\"answhy\">Silver는 0~5번, 공백은 6번, robot은 7번부터 마지막까지다.</p></details></div><div class=\"checkitem\" data-question=\"c3q6\"><h3>6. 끝 위치와 간격 구분하기</h3><p class=\"qdesc\">다음 결과가 나오도록 알맞은 표현을 고르시오.</p><div class=\"codewrap\"><pre>text = 'abcdefg'\nprint(<span class=\"bl\" data-bank=\"c3q6\" data-a=\"2\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 1 보기 선택\"></span>)</pre></div><div class=\"out goalout\">aceg</div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① text[:2]</span><span class=\"chip\">② text[::2]</span><span class=\"chip\">③ text[2:]</span><span class=\"chip\">④ text[1::2]</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ②</b></p><div class=\"pair\" data-case=\"case-29\"><pre><span class=\"b\">text</span> = <span class=\"s\">'abcdefg'</span>\n<span class=\"f\">print</span>(<span class=\"b\">text</span>[::<span class=\"s\">2</span>])</pre><div class=\"out\">aceg</div></div><p class=\"answhy\">인덱스 0, 2, 4, 6의 글자를 가져온다. 두 번째 콜론 뒤의 2는 간격이다.</p></details></div><div class=\"checkitem\" data-question=\"c3q7\"><h3>7. 각각 숫자로 바꾸어 더하기</h3><p class=\"qdesc\">두 값을 숫자로 더해 21이 나오도록 빈칸을 완성하시오.</p><div class=\"codewrap\"><pre>a = '9'\nb = '12'\nprint(<span class=\"bl\" data-bank=\"c3q7\" data-a=\"3\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 1 보기 선택\"></span>)</pre></div><div class=\"out goalout\">21</div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① int(a + b)</span><span class=\"chip\">② a + b</span><span class=\"chip\">③ int(a) + int(b)</span><span class=\"chip\">④ str(a) + str(b)</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ③</b></p><div class=\"pair\" data-case=\"case-30\"><pre><span class=\"b\">a</span> = <span class=\"s\">'9'</span>\n<span class=\"b\">b</span> = <span class=\"s\">'12'</span>\n<span class=\"f\">print</span>(<span class=\"f\">int</span>(<span class=\"b\">a</span>) + <span class=\"f\">int</span>(<span class=\"b\">b</span>))</pre><div class=\"out\">21</div></div><p class=\"answhy\">각 문자열을 먼저 정수로 바꾼 뒤 더해야 한다. int(a + b)는 연결한 문자열을 정수로 바꾸므로 912가 된다.</p></details></div><h2>3장 요점 정리</h2><div class=\"table-scroll\"><table class=\"sumtbl\"><tr><th>구분</th><th>핵심 내용</th></tr><tr><td>숫자형</td><td>정수는 int, 실수형은 float다. 계산에 사용할 입력값은 알맞은 숫자형으로 바꾼다.</td></tr><tr><td>숫자 연산</td><td>양의 정수에서 //는 몫, %는 나머지다. /의 결과는 실수형이다.</td></tr><tr><td>문자열</td><td>따옴표로 표현한다. +는 연결, * 정수는 반복이다.</td></tr><tr><td>인덱싱</td><td>한 글자를 꺼낸다. 앞에서는 0, 뒤에서는 -1부터 센다.</td></tr><tr><td>슬라이싱</td><td>범위를 꺼낸다. 끝 위치는 포함하지 않고, 간격을 생략하면 1이다.</td></tr><tr><td>날짜 출력</td><td>자리별로 나누는 동안에는 문자열로 유지해 월·일의 앞자리 0을 보존한다.</td></tr></table></div><div class=\"note\"><div class=\"ttl\">다음 장으로</div><p>다음 장에서는 여러 값을 리스트에 모아 저장한다. 이 장에서 배운 인덱싱과 슬라이싱을 리스트에도 적용해 보자.</p></div>"}, {"n": "심화", "t": "3장 심화 문제 풀이", "h": "<div class=\"banner\"><h1><span class=\"num\">심화</span>3장 심화 문제 풀이</h1></div><p class=\"lede\">여러 개념을 결합하는 선택 문제다. 기본 학습을 마친 뒤 풀고, 막히면 정답의 계산 순서를 한 단계씩 따라가 보자.</p><div class=\"checkitem\" data-question=\"c3a1\"><h3>심화 1. 제품 코드의 숫자 합산하기</h3><p class=\"qdesc\">문자열에 나타난 순서대로 8, 31, 6, 204를 꺼내 정수로 바꾼 뒤 더하시오.</p><div class=\"codewrap\"><pre>code = 'm8n31pq6r204'\ntotal = (<span class=\"bl\" data-bank=\"c3a1\" data-a=\"1\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 1 보기 선택\"></span> + <span class=\"bl\" data-bank=\"c3a1\" data-a=\"2\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 2 보기 선택\"></span>\n         + <span class=\"bl\" data-bank=\"c3a1\" data-a=\"3\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 3 보기 선택\"></span> + <span class=\"bl\" data-bank=\"c3a1\" data-a=\"4\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 4 보기 선택\"></span>)\nprint(total)</pre></div><div class=\"out goalout\">249</div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① int(code[1])</span><span class=\"chip\">② int(code[3:5])</span><span class=\"chip\">③ int(code[7])</span><span class=\"chip\">④ int(code[9:])</span><span class=\"chip\">⑤ int(code[2])</span><span class=\"chip\">⑥ int(code[8:])</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ①, ②, ③, ④</b></p><div class=\"pair\" data-case=\"case-31\"><pre><span class=\"b\">code</span> = <span class=\"s\">'m8n31pq6r204'</span>\n<span class=\"b\">total</span> = (<span class=\"f\">int</span>(<span class=\"b\">code</span>[<span class=\"s\">1</span>]) + <span class=\"f\">int</span>(<span class=\"b\">code</span>[<span class=\"s\">3</span>:<span class=\"s\">5</span>])\n         + <span class=\"f\">int</span>(<span class=\"b\">code</span>[<span class=\"s\">7</span>]) + <span class=\"f\">int</span>(<span class=\"b\">code</span>[<span class=\"s\">9</span>:]))\n<span class=\"f\">print</span>(<span class=\"b\">total</span>)</pre><div class=\"out\">249</div></div><p class=\"answhy\">8과 6은 한 글자이므로 인덱싱하고, 31과 204는 여러 글자이므로 슬라이싱한다. 각각 int()로 바꾸면 8 + 31 + 6 + 204 = 249다.</p></details></div><div class=\"checkitem\" data-question=\"c3a2\"><h3>심화 2. 두 기록의 시간 차이 구하기</h3><p class=\"qdesc\">기록은 MM:SS 형식이고 두 번째 기록이 더 늦다. 먼저 각 기록을 전체 초로 바꾸어 시간 차이를 구하시오. 빈칸에는 슬라이싱 범위만 넣는다.</p><div class=\"codewrap\"><pre>first = input('첫 기록(MM:SS): ')\nsecond = input('둘째 기록(MM:SS): ')\nfirst_seconds = int(first[<span class=\"bl\" data-bank=\"c3a2\" data-a=\"1\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 1 보기 선택\"></span>]) * 60 + int(first[<span class=\"bl\" data-bank=\"c3a2\" data-a=\"2\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 2 보기 선택\"></span>])\nsecond_seconds = int(second[<span class=\"bl\" data-bank=\"c3a2\" data-a=\"1\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 3 보기 선택\"></span>]) * 60 + int(second[<span class=\"bl\" data-bank=\"c3a2\" data-a=\"2\" tabindex=\"0\" role=\"button\" aria-label=\"빈칸 4 보기 선택\"></span>])\ngap = second_seconds - first_seconds\nprint(f'경과 시간: {gap}초')</pre></div><div class=\"out goalout\">첫 기록(MM:SS): 05:48\n둘째 기록(MM:SS): 07:16\n경과 시간: 88초</div><div class=\"bank\"><div class=\"ttl\">보기</div><div class=\"chips\"><span class=\"chip\">① :2</span><span class=\"chip\">② 3:</span><span class=\"chip\">③ 2:</span><span class=\"chip\">④ :3</span></div></div><details><summary>정답과 풀이</summary><p><b>정답: ①, ②, ①, ②</b></p><div class=\"pair\" data-case=\"case-32\"><pre><span class=\"b\">first</span> = <span class=\"f\">input</span>(<span class=\"s\">'첫 기록(MM:SS): '</span>)\n<span class=\"b\">second</span> = <span class=\"f\">input</span>(<span class=\"s\">'둘째 기록(MM:SS): '</span>)\n<span class=\"b\">first_seconds</span> = <span class=\"f\">int</span>(<span class=\"b\">first</span>[:<span class=\"s\">2</span>]) * <span class=\"s\">60</span> + <span class=\"f\">int</span>(<span class=\"b\">first</span>[<span class=\"s\">3</span>:])\n<span class=\"b\">second_seconds</span> = <span class=\"f\">int</span>(<span class=\"b\">second</span>[:<span class=\"s\">2</span>]) * <span class=\"s\">60</span> + <span class=\"f\">int</span>(<span class=\"b\">second</span>[<span class=\"s\">3</span>:])\n<span class=\"b\">gap</span> = <span class=\"b\">second_seconds</span> - <span class=\"b\">first_seconds</span>\n<span class=\"f\">print</span>(<span class=\"s\">f'</span><span class=\"s\">경과 시간: </span>{<span class=\"b\">gap</span>}<span class=\"s\">초</span><span class=\"s\">'</span>)</pre><div class=\"out\">첫 기록(MM:SS): 05:48\n둘째 기록(MM:SS): 07:16\n경과 시간: 88초</div></div><p class=\"answhy\">첫 기록은 348초, 둘째 기록은 436초다. 전체 초로 바꾸어 빼면 초 부분이 48에서 16으로 작아져도 올바르게 계산된다. 436 - 348 = 88이다.</p></details></div>"}];

const toc=document.getElementById('toc'),pg=document.getElementById('pg');
P.forEach((p,i)=>{
  const li=document.createElement('li');
  li.innerHTML=`<a href="#p${i}"><span class="n">${p.n}</span><span>${p.t}</span></a>`;
  toc.appendChild(li);
});
function render(){
  let i=parseInt((location.hash||'#p0').slice(2));
  if(isNaN(i)||i<0||i>=P.length)i=0;
  let nav='<div class="pager">';
  nav += i>0?`<a href="#p${i-1}"><span class="dir">PREV</span><span class="t">${P[i-1].n} ${P[i-1].t}</span></a>`:'<span class="ph"></span>';
  nav += i<P.length-1?`<a class="next" href="#p${i+1}"><span class="dir">NEXT</span><span class="t">${P[i+1].n} ${P[i+1].t}</span></a>`:'<span class="ph"></span>';
  nav+='</div>';
  const context='<div class="partkicker">2부 · 데이터를 저장하고 계산하기</div>';
  pg.innerHTML=context+P[i].h+nav;
  document.querySelectorAll('.toc a').forEach((a,k)=>a.classList.toggle('on',k===i));
  closeMenu();bindBlanks();
  window.scrollTo({top:0,behavior:'instant'});
}
const BANKS={"c3q1": ["int / int / str", "int / float / str", "float / float / int", "str / float / int"], "c3q2": ["//", "%", "/", "*"], "c3q3": ["GoGo / word", "wordword / Go", "GoGo / Go", "오류 발생"], "c3q4": ["C !", "o !", "C e", "오류 발생"], "c3q5": ["생략", "6", "7", "5"], "c3q6": ["text[:2]", "text[::2]", "text[2:]", "text[1::2]"], "c3q7": ["int(a + b)", "a + b", "int(a) + int(b)", "str(a) + str(b)"], "c3a1": ["int(code[1])", "int(code[3:5])", "int(code[7])", "int(code[9:])", "int(code[2])", "int(code[8:])"], "c3a2": [":2", "3:", "2:", ":3"]};
const CIRC=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
let menu=null;
function closeMenu(){if(menu){menu.remove();menu=null;}}
addEventListener('click',e=>{if(menu&&!menu.contains(e.target))closeMenu();});
addEventListener('scroll',closeMenu,true);
function bindBlanks(){
  document.querySelectorAll('pre .bl[data-a]').forEach(bl=>{
    bl.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();bl.click();}};
    bl.onclick=ev=>{
      ev.stopPropagation();closeMenu();
      const r=bl.getBoundingClientRect();
      menu=document.createElement('div');menu.className='blmenu';
      const bank=BANKS[bl.dataset.bank]||[];
      bank.forEach((v,i)=>{
        const b=document.createElement('button');
        b.textContent=CIRC[i]+' '+v;
        b.onclick=()=>{
          bl.textContent=CIRC[i];
          bl.classList.remove('ok','no');
          bl.classList.add(String(i+1)===bl.dataset.a?'ok':'no');
          closeMenu();
        };
        menu.appendChild(b);
      });
      document.body.appendChild(menu);
      const mh=menu.offsetHeight, mw=menu.offsetWidth;
      let top=r.bottom+6, left=r.left;
      if(top+mh>innerHeight-8) top=Math.max(8,r.top-mh-6);
      if(left+mw>innerWidth-8) left=innerWidth-mw-8;
      left=Math.max(8,left);
      menu.style.top=top+'px';menu.style.left=left+'px';
    };
  });
}
addEventListener('hashchange',render);render();
const sb=document.getElementById('sb'),mob=document.getElementById('mob');
mob.onclick=()=>{sb.classList.toggle('collapsed');};
if(innerWidth>980)sb.classList.remove('collapsed');
addEventListener('resize',()=>{if(innerWidth>980)sb.classList.remove('collapsed')});
document.querySelectorAll('.toc a').forEach(a=>a.addEventListener('click',()=>{if(innerWidth<=980)sb.classList.add('collapsed');}));

</script>
